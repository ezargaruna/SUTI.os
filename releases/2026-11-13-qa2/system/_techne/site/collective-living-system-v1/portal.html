const data={"ru":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · общая живая система","intro":"публичная система методов и совместной работы: понять важное, найти слова и выбрать доступный шаг. Участник сохраняет авторство, право исправить, отказаться и выйти.","status":"новый общий операционный слой: локальный редакционный черновик; независимая языковая проверка ожидается; юридический фонд, приём денег, действующая мировая сеть и публикация не подтверждены","cycle":"вопрос → слова → связи → карта → шаг → след → уточнение","privacy":"в публичном контуре остаются методы, общие инструкции и проверенные примеры. Личные записи, контакты, переписка и уязвимые сведения хранятся отдельно и не включаются в общий экспорт.","rights":"авторство, видимость, лицензия и разрешённые действия задаются отдельно для каждого вклада. Действующая лицензия на весь старый корпус не установлена.","contribution":"предложи изменение с источником и причиной → опиши проверку → запроси согласие затронутых участников → ответственное лицо принимает или откладывает изменение → сохрани след и возможность отката","sovereignty":"информационный суверенитет: понимать происхождение данных, выбирать доступ, экспорт и удаление собственных записей. Языковая, образовательная, творческая, экономическая и организационная самостоятельность развиваются через понятные навыки и проверяемые решения; достижение не обещается.","fund_title":"фонд поддержки жизни и любящих жизнь · агентство ангелов заботы","fund_purpose":"проект открытой поддержки полезных инициатив: обучение, доступные инструменты, взаимопомощь и забота о живой среде. Название рабочее; участие и образ ангела добровольны.","fund_state":"13 ноября 2026 начат локальный цикл подготовки. День 90 — 10 февраля 2027. Регистрация, юрисдикция, управляющие, банк, правила пожертвований и налоговый режим пока UNKNOWN; денежные операции не активированы.","fund_flow":"открытый запрос без чувствительных деталей → проверка соответствия цели и доступных ресурсов → решение без конфликта интересов → ограниченная поддержка → подтверждение результата без раскрытия получателя → возможность обращения и исправления","fund_phases":[["1–15","2026-11-13 — 2026-11-27","согласовать цель, владельца решений, страну регистрации, распределение ролей и условия участия; сформировать бюджетную модель без сбора денег"],["16–30","2026-11-28 — 2026-12-12","проверить правовой маршрут и партнёрский вариант; согласовать правила поддержки, конфликтов интересов, обращений, обработки данных и финансового контроля"],["31–45","2026-12-13 — 2026-12-27","собрать публичные инструкции на 13 языках, доступный прототип бота и формы, библиотеку микроуроков; начать независимую вычитку"],["46–60","2026-12-28 — 2027-01-11","провести малый добровольный пилот после необходимых разрешений; проверить согласие, доступность, ответы, экспорт и удаление собственных данных"],["61–75","2027-01-12 — 2027-01-26","оценить пилот, исправить дефекты, подготовить локальные партнёрские группы; расширять только подтверждённые процессы"],["76–90","2027-01-27 — 2027-02-10","сопоставить результаты с критериями, опубликовать допустимый обезличенный отчёт после разрешения, принять решение о следующем цикле и географии"]],"fund_roles":"ответственный за программу; финансы и независимая сверка; защита данных и безопасность участников; языковые редакторы; координаторы пилота; независимое рассмотрение обращений. Роли предлагаются, люди не назначены.","fund_metrics":"учитывать согласованное участие, завершённые полезные действия, время ответа, доступность, исправления и реальные расходы. Цели и численные пороги утверждаются перед пилотом; виральность и мировой охват не гарантируются.","fund_pause":"расхождение денег и отчёта, нарушение согласия, утечка, жалоба о вреде или отсутствие ответственного ведут к паузе соответствующего процесса, разбору и решению человека.","contours":[{"id":"SUTI.os","title":"устройство системы","purpose":"согласовать границы, инструменты, хранение и восстановление","procedure":"выбери задачу и контур → опиши вход и результат → проверь доступ и возврат → сохрани рабочую инструкцию","output":"карта среды и воспроизводимый рабочий шаг","boundary":"описание не подтверждает установленную систему или безопасность"},{"id":"SUTI.world","title":"публичный вход","purpose":"помочь человеку найти нужное направление и следующий шаг","procedure":"назови вопрос → выбери язык → открой подходящий модуль → попробуй один доступный шаг","output":"понятный маршрут и выбранное действие","boundary":"масштаб сети и польза подтверждаются наблюдениями, не обещанием"},{"id":"SUTI.uni","title":"самообразование","purpose":"превратить вопрос в короткую учебную практику","procedure":"сформулируй навык → изучи один пример → выполни малую задачу → проверь понимание своими словами","output":"микроурок, пример и обратная связь","boundary":"обучение не подменяет профессиональную помощь и квалификацию"},{"id":"SUTI.clan","title":"сотрудничество","purpose":"согласовать роли, вклад и границы участия","procedure":"сформулируй общее дело → запроси явное участие → согласуй права и роль → сохрани решение","output":"договорённость участников и карта ответственности","boundary":"имя человека или организации в карте не означает партнёрство или согласие"},{"id":"SUTI.lab","title":"исследование","purpose":"проверять идеи небольшими обратимыми пробами","procedure":"назови гипотезу → выбери наблюдаемый признак → проведи ограниченную пробу → запиши результат и сомнения","output":"исследовательская запись с основаниями","boundary":"гипотеза и символ не становятся фактом без проверки"},{"id":"SUTI.audit","title":"проверка","purpose":"сопоставлять результат с явным критерием","procedure":"определи область → выбери критерий → проверь материал → зафиксируй PASS, PARTIAL, FAIL или UNKNOWN","output":"отчёт, доказательства и открытые вопросы","boundary":"PASS действует только для названной версии и проверки"},{"id":"SUTI.crystal","title":"ясная форма","purpose":"сохранить существенное в самостоятельно понятном артефакте","procedure":"выдели вопрос и источник → назови инвариант → покажи пример и предел → добавь следующий шаг","output":"карточка сути с источником и контекстом","boundary":"краткость не оправдывает потерю условий, авторства или неопределённости"},{"id":"SUTI.oracle","title":"различение оснований","purpose":"отделять сведения, интерпретации и неизвестное","procedure":"сформулируй утверждение → назови тип → укажи основание → опиши способ проверки","output":"карта утверждений и оснований","boundary":"это метод рассмотрения, не предсказание и не автономный авторитет"},{"id":"SUTI.veche","title":"совместное рассмотрение","purpose":"делать предложения и разногласия видимыми","procedure":"представь предложение → запроси позиции → отдельно запиши поддержку, возражение, воздержание и отсутствие ответа → решение принимает ответственный человек","output":"журнал рассмотрения и принятое человеком решение","boundary":"молчание не является согласием; AI-обзор не считается голосованием людей"},{"id":"SUTI.sotkan","title":"связи и происхождение","purpose":"связывать материалы с источниками и историей изменений","procedure":"укажи источник → опиши преобразование → свяжи редакцию с оригиналом → проверь возможность исправления и возврата","output":"проверяемый след происхождения","boundary":"сходство текста не доказывает авторство, лицензию или передачу прав"},{"id":"SUTI.game","title":"добровольная практика","purpose":"исследовать навыки через игру NITYA и Samurai Dharma","procedure":"выбери обычный или символический язык → возьми малый квест → попробуй → запиши наблюдение или пропусти → выбери продолжение","output":"опыт практики и собственный следующий шаг","boundary":"игра добровольна; пауза, пропуск и выход доступны; возрастные дорожки требуют отдельной проверки"},{"id":"SUTI.logos","title":"язык и транскреация","purpose":"сохранять смысл при переносе между языками и средами","procedure":"выдели намерение и инвариант → переведи прямо с источника → сопоставь условия и уверенность → запроси независимую вычитку","output":"понятный текст, термины и статус каждой локали","boundary":"черновик не равен проверенному переводу; Язэхъ требует авторского глосса"},{"id":"SUTI.verenium","title":"навигация заботы","purpose":"помогать человеку выбрать посильную помощь и собственный шаг","procedure":"спроси, что важно → предложи понятные варианты → уточни границы → оставь выбор, паузу и выход","output":"выбранный маршрут помощи и согласованное действие","boundary":"ангел заботы — добровольный образ; сервис не является экстренной или клинической службой"}],"locale":"ru","translation_state":"source-draft","native_review":"pending","release":"HOLD","home_href":"../../human/collective-living-system-v1/ru/living-system.html","fund_href":"../../human/collective-living-system-v1/ru/care-90-days.html","contour_hrefs":{"SUTI.os":"../../human/collective-living-system-v1/ru/SUTI.os/living-system.html","SUTI.world":"../../human/collective-living-system-v1/ru/SUTI.world/living-system.html","SUTI.uni":"../../human/collective-living-system-v1/ru/SUTI.uni/living-system.html","SUTI.clan":"../../human/collective-living-system-v1/ru/SUTI.clan/living-system.html","SUTI.lab":"../../human/collective-living-system-v1/ru/SUTI.lab/living-system.html","SUTI.audit":"../../human/collective-living-system-v1/ru/SUTI.audit/living-system.html","SUTI.crystal":"../../human/collective-living-system-v1/ru/SUTI.crystal/living-system.html","SUTI.oracle":"../../human/collective-living-system-v1/ru/SUTI.oracle/living-system.html","SUTI.veche":"../../human/collective-living-system-v1/ru/SUTI.veche/living-system.html","SUTI.sotkan":"../../human/collective-living-system-v1/ru/SUTI.sotkan/living-system.html","SUTI.game":"../../human/collective-living-system-v1/ru/SUTI.game/living-system.html","SUTI.logos":"../../human/collective-living-system-v1/ru/SUTI.logos/living-system.html","SUTI.verenium":"../../human/collective-living-system-v1/ru/SUTI.verenium/living-system.html"}},"en":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · a shared living system","intro":"A public system of methods and collaboration: understand what matters, find words and choose an achievable next step. Each participant retains authorship and the right to correct, decline and leave.","status":"New shared operating layer: local editorial draft; independent language review pending. A legal fund, receipt of money, an operating worldwide network and publication are unconfirmed.","cycle":"question → words → connections → map → step → trace → revision","privacy":"The public space contains methods, general instructions and reviewed examples. Personal records, contacts, correspondence and sensitive information are kept separately and excluded from shared exports.","rights":"Authorship, visibility, licence and permitted actions are defined separately for each contribution. No applicable licence for the entire legacy collection has been established.","contribution":"Propose a change with its source and reason → describe verification → seek consent from affected participants → an accountable person accepts or defers the change → preserve a trace and rollback.","sovereignty":"Information sovereignty means understanding where data comes from and choosing access, export and deletion of your own records. Linguistic, educational, creative, economic and organisational autonomy develops through understandable skills and verifiable decisions; achievement is not promised.","fund_title":"Fund supporting life and people who love life · agency of care angels","fund_purpose":"A proposed open programme supporting useful initiatives: learning, accessible tools, mutual aid and care for the living environment. The name is provisional; participation and angel imagery are optional.","fund_state":"The local preparation cycle began on 13 November 2026. Day 90 is 10 February 2027. Registration, jurisdiction, trustees, banking, donation rules and tax treatment remain UNKNOWN; financial operations have not been activated.","fund_flow":"Open request without sensitive details → check alignment with purpose and available resources → decision without conflicts of interest → bounded support → evidence of outcome without exposing recipients → appeal and correction.","fund_phases":[["1–15","2026-11-13 — 2026-11-27","Agree purpose, accountable decision owner, registration country, roles and participation terms; model a budget without collecting money."],["16–30","2026-11-28 — 2026-12-12","Review the legal route and partnership option; agree support rules, conflicts of interest, appeals, data handling and financial controls."],["31–45","2026-12-13 — 2026-12-27","Assemble public instructions in 13 languages, an accessible bot and form prototype, and a micro-lesson library; begin independent review."],["46–60","2026-12-28 — 2027-01-11","Run a small voluntary pilot after required permissions; check consent, accessibility, responses, export and deletion of participants’ own data."],["61–75","2027-01-12 — 2027-01-26","Evaluate the pilot, fix defects and prepare local partner groups; expand only confirmed processes."],["76–90","2027-01-27 — 2027-02-10","Compare outcomes with criteria, publish an eligible anonymised report after approval, and decide the next cycle and geographic scope."]],"fund_roles":"Programme accountability; finance and independent reconciliation; data protection and participant safety; language editors; pilot coordinators; independent handling of appeals. Roles are proposed; no people have been appointed.","fund_metrics":"Track consented participation, completed useful actions, response time, accessibility, corrections and actual expenditure. Targets and numerical thresholds are agreed before the pilot; virality and worldwide reach are not guaranteed.","fund_pause":"A discrepancy between money and reporting, a consent breach, a leak, a complaint about harm or lack of an accountable person pauses the relevant process for review and a human decision.","contours":[{"id":"SUTI.os","title":"system structure","purpose":"Align boundaries, tools, storage and recovery.","procedure":"Choose a task and contour → describe input and output → check access and recovery → save a working instruction.","output":"An environment map and a reproducible working step.","boundary":"A description does not establish an installed system or security."},{"id":"SUTI.world","title":"public entry","purpose":"Help people find a relevant direction and next step.","procedure":"Name a question → choose a language → open a suitable module → try one achievable step.","output":"A clear route and a chosen action.","boundary":"Network scale and usefulness require observations, not promises."},{"id":"SUTI.uni","title":"self-directed learning","purpose":"Turn a question into a short learning practice.","procedure":"Name a skill → study one example → complete a small task → explain your understanding in your own words.","output":"A micro-lesson, example and feedback.","boundary":"Learning does not replace professional help or qualifications."},{"id":"SUTI.clan","title":"collaboration","purpose":"Agree roles, contributions and participation boundaries.","procedure":"Describe a shared task → ask for explicit participation → agree rights and roles → record the decision.","output":"A participant agreement and responsibility map.","boundary":"Naming a person or organisation does not establish partnership or consent."},{"id":"SUTI.lab","title":"research","purpose":"Explore ideas through small reversible trials.","procedure":"Name a hypothesis → choose an observable indicator → run a bounded trial → record outcomes and uncertainty.","output":"A research note with evidence.","boundary":"Hypotheses and symbols do not become facts without verification."},{"id":"SUTI.audit","title":"verification","purpose":"Compare an outcome with an explicit criterion.","procedure":"Define scope → choose a criterion → check the material → record PASS, PARTIAL, FAIL or UNKNOWN.","output":"A report, evidence and open questions.","boundary":"PASS applies only to the named version and check."},{"id":"SUTI.crystal","title":"clear form","purpose":"Preserve what matters in a self-contained artifact.","procedure":"Identify a question and source → name the invariant → show an example and limits → add a next step.","output":"A concise meaning card with source and context.","boundary":"Brevity does not justify losing conditions, authorship or uncertainty."},{"id":"SUTI.oracle","title":"grounds for claims","purpose":"Distinguish information, interpretations and unknowns.","procedure":"State a claim → name its type → identify its basis → describe how to check it.","output":"A map of claims and their grounds.","boundary":"This is a review method, not prediction or autonomous authority."},{"id":"SUTI.veche","title":"shared deliberation","purpose":"Make proposals and disagreements visible.","procedure":"Present a proposal → request positions → record support, objection, abstention and no response separately → an accountable person decides.","output":"A deliberation record and a human decision.","boundary":"Silence is not consent; AI review is not a vote by people."},{"id":"SUTI.sotkan","title":"connections and provenance","purpose":"Connect material with sources and change history.","procedure":"Identify the source → describe the transformation → link the edition to the original → check correction and rollback.","output":"A verifiable provenance trace.","boundary":"Text similarity does not establish authorship, licensing or transfer of rights."},{"id":"SUTI.game","title":"voluntary practice","purpose":"Explore skills through NITYA and Samurai Dharma play.","procedure":"Choose plain or symbolic language → take a small quest → try it → record an observation or skip → choose whether to continue.","output":"Practice experience and your own next step.","boundary":"Play is voluntary; pause, skip and exit remain available; age pathways need separate review."},{"id":"SUTI.logos","title":"language and transcreation","purpose":"Preserve meaning across languages and settings.","procedure":"Identify intent and invariant → translate directly from the source → compare conditions and confidence → request independent review.","output":"Understandable text, terminology and a status for each locale.","boundary":"A draft is not a reviewed translation; Yazekh requires an author-approved gloss."},{"id":"SUTI.verenium","title":"care navigation","purpose":"Help people choose feasible support and their own step.","procedure":"Ask what matters → offer clear options → clarify boundaries → preserve choice, pause and exit.","output":"A chosen support route and an agreed action.","boundary":"Care angel is an optional image; the service is not an emergency or clinical service."}],"locale":"en","translation_state":"direct-source-draft-unreviewed","native_review":"pending","release":"HOLD","home_href":"../../../en/living-system.html","fund_href":"../../../en/care-90-days.html","contour_hrefs":{"SUTI.os":"../../../en/SUTI.os/living-system.html","SUTI.world":"../../../en/SUTI.world/living-system.html","SUTI.uni":"../../../en/SUTI.uni/living-system.html","SUTI.clan":"../../../en/SUTI.clan/living-system.html","SUTI.lab":"../../../en/SUTI.lab/living-system.html","SUTI.audit":"../../../en/SUTI.audit/living-system.html","SUTI.crystal":"../../../en/SUTI.crystal/living-system.html","SUTI.oracle":"../../../en/SUTI.oracle/living-system.html","SUTI.veche":"../../../en/SUTI.veche/living-system.html","SUTI.sotkan":"../../../en/SUTI.sotkan/living-system.html","SUTI.game":"../../../en/SUTI.game/living-system.html","SUTI.logos":"../../../en/SUTI.logos/living-system.html","SUTI.verenium":"../../../en/SUTI.verenium/living-system.html"}},"es":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · sistema vivo compartido","intro":"Un sistema público de métodos y colaboración: comprender lo importante, encontrar palabras y elegir un siguiente paso posible. Cada participante conserva la autoría y el derecho a corregir, rechazar y salir.","status":"Nueva capa operativa compartida: borrador editorial local; revisión lingüística independiente pendiente. No se han confirmado una fundación legal, la recepción de dinero, una red mundial en funcionamiento ni la publicación.","cycle":"pregunta → palabras → vínculos → mapa → paso → registro → revisión","privacy":"El espacio público contiene métodos, instrucciones generales y ejemplos revisados. Los registros personales, contactos, correspondencia e información sensible se guardan por separado y se excluyen de las exportaciones compartidas.","rights":"La autoría, visibilidad, licencia y acciones permitidas se definen por separado para cada aporte. No se ha establecido una licencia aplicable a todo el corpus anterior.","contribution":"Propón un cambio con su fuente y motivo → describe cómo verificarlo → solicita el consentimiento de las personas afectadas → una persona responsable acepta o aplaza el cambio → conserva un registro y la posibilidad de revertirlo.","sovereignty":"La soberanía informativa implica comprender el origen de los datos y elegir el acceso, la exportación y la eliminación de los propios registros. La autonomía lingüística, educativa, creativa, económica y organizativa se desarrolla mediante habilidades comprensibles y decisiones verificables; no se promete alcanzarla.","fund_title":"Fondo de apoyo a la vida y a quienes aman la vida · agencia de ángeles del cuidado","fund_purpose":"Propuesta de un programa abierto para apoyar iniciativas útiles: aprendizaje, herramientas accesibles, ayuda mutua y cuidado del entorno vivo. El nombre es provisional; la participación y la imagen del ángel son opcionales.","fund_state":"El ciclo local de preparación comenzó el 13 de noviembre de 2026. El día 90 es el 10 de febrero de 2027. El registro, la jurisdicción, los responsables de gestión, el banco, las reglas de donación y el régimen fiscal siguen UNKNOWN; no se han activado operaciones financieras.","fund_flow":"Solicitud abierta sin detalles sensibles → comprobar afinidad con el propósito y los recursos disponibles → decidir sin conflictos de interés → apoyo delimitado → evidencia del resultado sin exponer a quienes lo reciben → apelación y corrección.","fund_phases":[["1–15","2026-11-13 — 2026-11-27","Acordar propósito, responsable de decisiones, país de registro, roles y condiciones de participación; modelar el presupuesto sin recaudar dinero."],["16–30","2026-11-28 — 2026-12-12","Revisar la vía legal y la opción de alianza; acordar reglas de apoyo, conflictos de interés, apelaciones, datos y control financiero."],["31–45","2026-12-13 — 2026-12-27","Preparar instrucciones públicas en 13 idiomas, un prototipo accesible de bot y formulario y una biblioteca de microlecciones; iniciar revisión independiente."],["46–60","2026-12-28 — 2027-01-11","Realizar un piloto pequeño y voluntario con los permisos necesarios; verificar consentimiento, accesibilidad, respuestas, exportación y eliminación de datos propios."],["61–75","2027-01-12 — 2027-01-26","Evaluar el piloto, corregir defectos y preparar grupos locales aliados; ampliar solo procesos confirmados."],["76–90","2027-01-27 — 2027-02-10","Comparar resultados con criterios, publicar un informe anonimizado apto tras la autorización y decidir el siguiente ciclo y su alcance geográfico."]],"fund_roles":"Responsabilidad del programa; finanzas y conciliación independiente; protección de datos y seguridad de participantes; edición lingüística; coordinación del piloto; revisión independiente de apelaciones. Son roles propuestos; no se han designado personas.","fund_metrics":"Registrar participación consentida, acciones útiles completadas, tiempo de respuesta, accesibilidad, correcciones y gastos reales. Las metas y los umbrales numéricos se acuerdan antes del piloto; no se garantizan la viralidad ni el alcance mundial.","fund_pause":"Una discrepancia entre dinero e informes, una vulneración del consentimiento, una filtración, una queja por daño o la falta de una persona responsable requieren pausar el proceso afectado, revisarlo y someterlo a una decisión humana.","contours":[{"id":"SUTI.os","title":"estructura del sistema","purpose":"Acordar límites, herramientas, almacenamiento y recuperación.","procedure":"Elige una tarea y un ámbito → describe entrada y resultado → verifica acceso y recuperación → guarda una instrucción de trabajo.","output":"Un mapa del entorno y un paso reproducible.","boundary":"Una descripción no demuestra instalación ni seguridad."},{"id":"SUTI.world","title":"entrada pública","purpose":"Ayudar a encontrar una dirección pertinente y el siguiente paso.","procedure":"Nombra tu pregunta → elige idioma → abre un módulo adecuado → prueba un paso posible.","output":"Una ruta clara y una acción elegida.","boundary":"La escala de la red y su utilidad requieren observaciones, no promesas."},{"id":"SUTI.uni","title":"autoaprendizaje","purpose":"Convertir una pregunta en una práctica breve de aprendizaje.","procedure":"Define una habilidad → estudia un ejemplo → realiza una tarea pequeña → explica lo comprendido con tus palabras.","output":"Una microlección, un ejemplo y retroalimentación.","boundary":"El aprendizaje no sustituye ayuda profesional ni acreditaciones."},{"id":"SUTI.clan","title":"colaboración","purpose":"Acordar roles, aportes y límites de participación.","procedure":"Describe una tarea compartida → solicita participación explícita → acuerda derechos y roles → registra la decisión.","output":"Un acuerdo entre participantes y un mapa de responsabilidades.","boundary":"Nombrar a alguien o a una organización no establece alianza ni consentimiento."},{"id":"SUTI.lab","title":"investigación","purpose":"Explorar ideas con pruebas pequeñas y reversibles.","procedure":"Nombra una hipótesis → elige un indicador observable → realiza una prueba delimitada → registra resultados e incertidumbres.","output":"Una nota de investigación con fundamentos.","boundary":"Las hipótesis y los símbolos necesitan verificación para sostener afirmaciones fácticas."},{"id":"SUTI.audit","title":"verificación","purpose":"Comparar un resultado con un criterio explícito.","procedure":"Define el alcance → elige un criterio → revisa el material → registra PASS, PARTIAL, FAIL o UNKNOWN.","output":"Un informe, evidencia y preguntas abiertas.","boundary":"PASS se aplica solo a la versión y comprobación nombradas."},{"id":"SUTI.crystal","title":"forma clara","purpose":"Conservar lo esencial en una pieza comprensible por sí misma.","procedure":"Identifica pregunta y fuente → nombra el invariante → muestra ejemplo y límites → añade un siguiente paso.","output":"Una ficha de sentido con fuente y contexto.","boundary":"La brevedad no justifica perder condiciones, autoría o incertidumbre."},{"id":"SUTI.oracle","title":"fundamentos de las afirmaciones","purpose":"Distinguir información, interpretaciones y lo desconocido.","procedure":"Formula una afirmación → identifica su tipo → indica su fundamento → describe cómo verificarla.","output":"Un mapa de afirmaciones y fundamentos.","boundary":"Es un método de revisión; no predice ni decide de forma autónoma."},{"id":"SUTI.veche","title":"deliberación compartida","purpose":"Hacer visibles propuestas y desacuerdos.","procedure":"Presenta una propuesta → solicita posiciones → registra por separado apoyo, objeción, abstención y ausencia de respuesta → decide una persona responsable.","output":"Un registro de deliberación y una decisión humana.","boundary":"El silencio no es consentimiento; una revisión de IA no es una votación de personas."},{"id":"SUTI.sotkan","title":"vínculos y procedencia","purpose":"Vincular materiales con sus fuentes e historia de cambios.","procedure":"Indica la fuente → describe la transformación → vincula la edición con el original → comprueba corrección y reversión.","output":"Un rastro verificable de procedencia.","boundary":"La similitud textual no establece autoría, licencia ni cesión de derechos."},{"id":"SUTI.game","title":"práctica voluntaria","purpose":"Explorar habilidades mediante los juegos NITYA y Samurai Dharma.","procedure":"Elige lenguaje cotidiano o simbólico → toma una pequeña misión → prueba → registra una observación o salta el paso → elige si continuar.","output":"Experiencia de práctica y un siguiente paso propio.","boundary":"El juego es voluntario; se puede pausar, omitir o salir; las rutas por edades requieren revisión específica."},{"id":"SUTI.logos","title":"lengua y transcreación","purpose":"Conservar el sentido entre idiomas y entornos.","procedure":"Identifica intención e invariante → traduce directamente de la fuente → compara condiciones y grado de certeza → solicita revisión independiente.","output":"Texto comprensible, términos y estado de cada idioma.","boundary":"Un borrador no equivale a una traducción revisada; Yazekh requiere una glosa aprobada por su autor."},{"id":"SUTI.verenium","title":"orientación para el cuidado","purpose":"Ayudar a elegir apoyo posible y un paso propio.","procedure":"Pregunta qué importa → ofrece opciones claras → aclara límites → conserva elección, pausa y salida.","output":"Una ruta de apoyo elegida y una acción acordada.","boundary":"Ángel del cuidado es una imagen opcional; el servicio no es de urgencias ni clínico."}],"locale":"es","translation_state":"direct-source-draft-unreviewed","native_review":"pending","release":"HOLD","home_href":"../../../es/living-system.html","fund_href":"../../../es/care-90-days.html","contour_hrefs":{"SUTI.os":"../../../es/SUTI.os/living-system.html","SUTI.world":"../../../es/SUTI.world/living-system.html","SUTI.uni":"../../../es/SUTI.uni/living-system.html","SUTI.clan":"../../../es/SUTI.clan/living-system.html","SUTI.lab":"../../../es/SUTI.lab/living-system.html","SUTI.audit":"../../../es/SUTI.audit/living-system.html","SUTI.crystal":"../../../es/SUTI.crystal/living-system.html","SUTI.oracle":"../../../es/SUTI.oracle/living-system.html","SUTI.veche":"../../../es/SUTI.veche/living-system.html","SUTI.sotkan":"../../../es/SUTI.sotkan/living-system.html","SUTI.game":"../../../es/SUTI.game/living-system.html","SUTI.logos":"../../../es/SUTI.logos/living-system.html","SUTI.verenium":"../../../es/SUTI.verenium/living-system.html"}},"pt-br":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · sistema vivo compartilhado","intro":"Um sistema público de métodos e colaboração: entender o que importa, encontrar palavras e escolher um próximo passo possível. Cada participante mantém a autoria e o direito de corrigir, recusar e sair.","status":"Nova camada operacional compartilhada: rascunho editorial local; revisão linguística independente pendente. Uma fundação legal, o recebimento de dinheiro, uma rede mundial em funcionamento e a publicação não foram confirmados.","cycle":"pergunta → palavras → vínculos → mapa → passo → registro → revisão","privacy":"O espaço público contém métodos, instruções gerais e exemplos revisados. Registros pessoais, contatos, correspondências e informações sensíveis ficam separados e não entram nas exportações compartilhadas.","rights":"Autoria, visibilidade, licença e ações permitidas são definidas separadamente para cada contribuição. Não foi estabelecida uma licença aplicável a todo o acervo anterior.","contribution":"Proponha uma mudança com fonte e motivo → descreva a verificação → solicite consentimento das pessoas afetadas → uma pessoa responsável aceita ou adia a mudança → preserve o registro e a possibilidade de reversão.","sovereignty":"Soberania informacional significa entender a origem dos dados e escolher acesso, exportação e exclusão dos próprios registros. A autonomia linguística, educacional, criativa, econômica e organizacional se desenvolve com habilidades compreensíveis e decisões verificáveis; sua realização não é prometida.","fund_title":"Fundo de apoio à vida e a quem ama a vida · agência dos anjos do cuidado","fund_purpose":"Proposta de programa aberto para apoiar iniciativas úteis: aprendizagem, ferramentas acessíveis, ajuda mútua e cuidado com o ambiente vivo. O nome é provisório; a participação e a imagem do anjo são opcionais.","fund_state":"O ciclo local de preparação começou em 13 de novembro de 2026. O dia 90 será 10 de fevereiro de 2027. Registro, jurisdição, responsáveis pela gestão, banco, regras de doação e regime tributário permanecem UNKNOWN; operações financeiras não foram ativadas.","fund_flow":"Solicitação aberta sem detalhes sensíveis → verificar adequação ao propósito e aos recursos disponíveis → decisão sem conflitos de interesse → apoio delimitado → comprovar o resultado sem expor quem recebe apoio → recurso e correção.","fund_phases":[["1–15","2026-11-13 — 2026-11-27","Acordar propósito, responsável pelas decisões, país de registro, papéis e condições de participação; modelar o orçamento sem arrecadar dinheiro."],["16–30","2026-11-28 — 2026-12-12","Revisar o caminho jurídico e a opção de parceria; acordar regras de apoio, conflitos de interesse, recursos, dados e controles financeiros."],["31–45","2026-12-13 — 2026-12-27","Preparar instruções públicas em 13 idiomas, um protótipo acessível de bot e formulário e uma biblioteca de microaulas; iniciar revisão independente."],["46–60","2026-12-28 — 2027-01-11","Realizar um piloto pequeno e voluntário após as permissões necessárias; verificar consentimento, acessibilidade, respostas, exportação e exclusão dos próprios dados."],["61–75","2027-01-12 — 2027-01-26","Avaliar o piloto, corrigir falhas e preparar grupos locais parceiros; ampliar somente processos confirmados."],["76–90","2027-01-27 — 2027-02-10","Comparar resultados com critérios, publicar um relatório anonimizado adequado após autorização e decidir o próximo ciclo e a área geográfica."]],"fund_roles":"Responsável pelo programa; finanças e conciliação independente; proteção de dados e segurança dos participantes; edição linguística; coordenação do piloto; análise independente de recursos. São papéis propostos; nenhuma pessoa foi nomeada.","fund_metrics":"Registrar participação consentida, ações úteis concluídas, tempo de resposta, acessibilidade, correções e despesas reais. Metas e limites numéricos são acordados antes do piloto; viralidade e alcance mundial não são garantidos.","fund_pause":"Divergência entre dinheiro e relatório, violação de consentimento, vazamento, reclamação sobre dano ou ausência de responsável levam à pausa do processo afetado, à análise e à decisão humana.","contours":[{"id":"SUTI.os","title":"estrutura do sistema","purpose":"Alinhar limites, ferramentas, armazenamento e recuperação.","procedure":"Escolha uma tarefa e um âmbito → descreva entrada e resultado → verifique acesso e recuperação → salve uma instrução de trabalho.","output":"Um mapa do ambiente e um passo reproduzível.","boundary":"Uma descrição não comprova instalação nem segurança."},{"id":"SUTI.world","title":"entrada pública","purpose":"Ajudar a encontrar um caminho pertinente e o próximo passo.","procedure":"Nomeie a pergunta → escolha o idioma → abra um módulo adequado → experimente um passo possível.","output":"Um caminho claro e uma ação escolhida.","boundary":"O alcance da rede e sua utilidade exigem observações, não promessas."},{"id":"SUTI.uni","title":"autoaprendizagem","purpose":"Transformar uma pergunta em uma prática curta de aprendizagem.","procedure":"Defina uma habilidade → estude um exemplo → faça uma tarefa pequena → explique o que entendeu com suas palavras.","output":"Uma microaula, um exemplo e retorno.","boundary":"Aprender não substitui ajuda profissional nem qualificação."},{"id":"SUTI.clan","title":"colaboração","purpose":"Acordar papéis, contribuições e limites de participação.","procedure":"Descreva uma tarefa comum → solicite participação explícita → combine direitos e papéis → registre a decisão.","output":"Um acordo entre participantes e um mapa de responsabilidades.","boundary":"Citar uma pessoa ou organização não estabelece parceria nem consentimento."},{"id":"SUTI.lab","title":"pesquisa","purpose":"Explorar ideias com testes pequenos e reversíveis.","procedure":"Nomeie uma hipótese → escolha um indicador observável → faça um teste delimitado → registre resultados e incertezas.","output":"Uma nota de pesquisa com fundamentos.","boundary":"Hipóteses e símbolos não se tornam fatos sem verificação."},{"id":"SUTI.audit","title":"verificação","purpose":"Comparar um resultado com um critério explícito.","procedure":"Defina o escopo → escolha um critério → confira o material → registre PASS, PARTIAL, FAIL ou UNKNOWN.","output":"Um relatório, evidências e questões abertas.","boundary":"PASS vale apenas para a versão e a verificação nomeadas."},{"id":"SUTI.crystal","title":"forma clara","purpose":"Preservar o essencial em um artefato compreensível por si só.","procedure":"Identifique pergunta e fonte → nomeie o invariante → mostre exemplo e limites → acrescente um próximo passo.","output":"Uma ficha de sentido com fonte e contexto.","boundary":"A brevidade não justifica perder condições, autoria ou incerteza."},{"id":"SUTI.oracle","title":"fundamentos das afirmações","purpose":"Distinguir informações, interpretações e o desconhecido.","procedure":"Formule uma afirmação → nomeie seu tipo → indique a base → descreva como verificá-la.","output":"Um mapa de afirmações e fundamentos.","boundary":"É um método de análise; não faz previsões nem exerce autoridade autônoma."},{"id":"SUTI.veche","title":"deliberação compartilhada","purpose":"Tornar visíveis propostas e divergências.","procedure":"Apresente uma proposta → solicite posições → registre separadamente apoio, objeção, abstenção e ausência de resposta → uma pessoa responsável decide.","output":"Um registro da deliberação e uma decisão humana.","boundary":"Silêncio não é consentimento; revisão por IA não é votação de pessoas."},{"id":"SUTI.sotkan","title":"vínculos e proveniência","purpose":"Vincular materiais às fontes e ao histórico de mudanças.","procedure":"Indique a fonte → descreva a transformação → vincule a edição ao original → verifique correção e reversão.","output":"Um registro verificável de proveniência.","boundary":"Semelhança textual não comprova autoria, licença nem transferência de direitos."},{"id":"SUTI.game","title":"prática voluntária","purpose":"Explorar habilidades por meio dos jogos NITYA e Samurai Dharma.","procedure":"Escolha linguagem cotidiana ou simbólica → aceite uma pequena missão → experimente → registre uma observação ou pule → escolha se quer continuar.","output":"Experiência de prática e um próximo passo próprio.","boundary":"O jogo é voluntário; pausa, pular e sair ficam disponíveis; percursos por idade exigem revisão específica."},{"id":"SUTI.logos","title":"língua e transcriação","purpose":"Preservar o sentido entre idiomas e contextos.","procedure":"Identifique intenção e invariante → traduza diretamente da fonte → compare condições e grau de certeza → solicite revisão independente.","output":"Texto compreensível, termos e estado de cada idioma.","boundary":"Rascunho não equivale a tradução revisada; Yazekh requer uma glosa aprovada pelo autor."},{"id":"SUTI.verenium","title":"orientação para o cuidado","purpose":"Ajudar a escolher apoio viável e um passo próprio.","procedure":"Pergunte o que importa → ofereça opções claras → esclareça limites → preserve escolha, pausa e saída.","output":"Um caminho de apoio escolhido e uma ação acordada.","boundary":"Anjo do cuidado é uma imagem opcional; o serviço não é de emergência nem clínico."}],"locale":"pt-br","translation_state":"direct-source-draft-unreviewed","native_review":"pending","release":"HOLD","home_href":"../../../pt-br/living-system.html","fund_href":"../../../pt-br/care-90-days.html","contour_hrefs":{"SUTI.os":"../../../pt-br/SUTI.os/living-system.html","SUTI.world":"../../../pt-br/SUTI.world/living-system.html","SUTI.uni":"../../../pt-br/SUTI.uni/living-system.html","SUTI.clan":"../../../pt-br/SUTI.clan/living-system.html","SUTI.lab":"../../../pt-br/SUTI.lab/living-system.html","SUTI.audit":"../../../pt-br/SUTI.audit/living-system.html","SUTI.crystal":"../../../pt-br/SUTI.crystal/living-system.html","SUTI.oracle":"../../../pt-br/SUTI.oracle/living-system.html","SUTI.veche":"../../../pt-br/SUTI.veche/living-system.html","SUTI.sotkan":"../../../pt-br/SUTI.sotkan/living-system.html","SUTI.game":"../../../pt-br/SUTI.game/living-system.html","SUTI.logos":"../../../pt-br/SUTI.logos/living-system.html","SUTI.verenium":"../../../pt-br/SUTI.verenium/living-system.html"}},"zh-hans":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · 共同的活态系统","intro":"一套面向公众的方法与协作体系：理解重要之事，找到表达方式，选择可行的下一步。参与者保留作者身份，以及修改、拒绝和退出的权利。","status":"新的共同运作层：本地编辑草稿；独立语言审校尚待进行；基金会的法律设立、资金接收、实际运行的全球网络及发布均未获确认","cycle":"问题 → 表达 → 联系 → 地图 → 行动 → 记录 → 修订","privacy":"公共空间只保留方法、通用说明和经过检查的示例。个人记录、联系方式、私人通信和敏感信息另行保存，不纳入共同导出包。","rights":"每一项贡献分别注明作者身份、可见范围、许可证和允许的操作。尚未确定适用于全部旧有内容的有效许可证。","contribution":"提出修改并注明来源和理由 → 说明检查方式 → 征求受影响参与者的同意 → 负责人接受或暂缓修改 → 保存记录及回退方式","sovereignty":"信息自主权：理解数据来源，自主选择访问权限、导出和删除自己的记录。语言、教育、创作、经济和组织方面的自主能力，通过清晰可学的技能和可核查的决定逐步发展；不承诺必然实现。","fund_title":"支持生命与热爱生命者的基金 · 关怀天使机构","fund_purpose":"一个支持有益倡议的开放项目：学习、无障碍工具、互助，以及对生命环境的关怀。名称为暂定；参与和天使意象均属自愿。","fund_state":"本地筹备周期于2026-11-13开始。第90天为2027-02-10。注册、司法管辖区、管理人员、银行、捐赠规则和税务制度均为UNKNOWN；资金操作尚未启用。","fund_flow":"提出不含敏感细节的公开请求 → 核查是否符合宗旨及现有资源 → 在无利益冲突的情况下作出决定 → 提供范围有限的支持 → 在不披露受助者身份的前提下确认结果 → 提供申诉及纠正途径","fund_phases":[["1–15","2026-11-13 — 2026-11-27","就宗旨、决策负责人、注册国家、角色分工和参与条件达成一致；在不筹集资金的前提下建立预算模型"],["16–30","2026-11-28 — 2026-12-12","核查法律途径及合作伙伴方案；就支持、利益冲突、申诉、数据处理和财务监督规则达成一致"],["31–45","2026-12-13 — 2026-12-27","编写13种语言的公共说明，制作无障碍机器人及表单原型、微课资料库；启动独立审校"],["46–60","2026-12-28 — 2027-01-11","取得必要许可后开展小规模自愿试点；检查同意、无障碍使用、回应、个人数据导出与删除"],["61–75","2027-01-12 — 2027-01-26","评估试点，修正缺陷，筹备本地合作小组；只扩展已经得到确认的流程"],["76–90","2027-01-27 — 2027-02-10","依据标准核对结果，经许可后发布符合条件的匿名报告，决定下一周期及适用地区"]],"fund_roles":"项目负责人；财务与独立核对；数据保护与参与者安全；语言编辑；试点协调员；独立申诉审查。这些角色仅为提议，尚未指定人员。","fund_metrics":"记录经同意的参与、已完成的有益行动、响应时间、无障碍情况、修正和实际支出。目标与数值门槛须在试点前批准；不保证病毒式传播或全球覆盖。","fund_pause":"资金与报告不符、违反同意、数据泄露、伤害投诉或缺少负责人时，应暂停相应流程，进行审查，并由人作出决定。","contours":[{"id":"SUTI.os","title":"系统结构","purpose":"协调边界、工具、存储与恢复","procedure":"选择任务与范围 → 描述输入和结果 → 检查访问与恢复途径 → 保存工作说明","output":"环境地图及可重复执行的工作步骤","boundary":"文字描述不能证明系统已安装或安全性已得到确认"},{"id":"SUTI.world","title":"公共入口","purpose":"帮助人们找到合适方向和下一步","procedure":"提出问题 → 选择语言 → 打开合适模块 → 尝试一个可行步骤","output":"清晰的路线及选定的行动","boundary":"网络规模和实际益处须由观察结果证实，不能靠承诺"},{"id":"SUTI.uni","title":"自主学习","purpose":"把问题转化为简短的学习练习","procedure":"明确技能 → 学习一个示例 → 完成小任务 → 用自己的话检查理解","output":"微课、示例和反馈","boundary":"学习不能替代专业帮助或专业资质"},{"id":"SUTI.clan","title":"协作","purpose":"就角色、贡献和参与边界达成一致","procedure":"说明共同事项 → 征求明确参与 → 约定权利及角色 → 保存决定","output":"参与者的约定及责任地图","boundary":"地图中出现个人或组织名称，不表示合作关系或同意"},{"id":"SUTI.lab","title":"研究","purpose":"用小规模、可撤回的试验检验想法","procedure":"提出假设 → 选择可观察指标 → 进行范围有限的试验 → 记录结果与疑问","output":"附有依据的研究记录","boundary":"假设和象征未经检验不能成为事实"},{"id":"SUTI.audit","title":"核查","purpose":"依据明确标准检查结果","procedure":"确定范围 → 选择标准 → 检查材料 → 记录PASS、PARTIAL、FAIL或UNKNOWN","output":"报告、证据和待解问题","boundary":"PASS仅适用于已注明的版本及核查范围"},{"id":"SUTI.crystal","title":"清晰表达","purpose":"将重要内容保存在可独立理解的成果中","procedure":"明确问题和来源 → 说明不变量 → 展示示例与界限 → 添加下一步","output":"附有来源及语境的核心卡片","boundary":"简短不能成为丢失条件、作者身份或不确定性的理由"},{"id":"SUTI.oracle","title":"辨别依据","purpose":"区分信息、解释与未知事项","procedure":"表述主张 → 标注类型 → 注明依据 → 说明核查方法","output":"主张与依据的地图","boundary":"这是一种审视方法，不是预测，也不是自主权威"},{"id":"SUTI.veche","title":"共同审议","purpose":"让提议和分歧清晰可见","procedure":"提出建议 → 征求意见 → 分别记录支持、反对、弃权和未回应 → 由负责人作出决定","output":"审议记录及由人作出的决定","boundary":"沉默不表示同意；AI审阅不能算作人的投票"},{"id":"SUTI.sotkan","title":"联系与来源","purpose":"将材料与其来源及修改历史相连","procedure":"注明来源 → 描述转换 → 将修订版链接至原文 → 检查纠正与恢复途径","output":"可核查的来源记录","boundary":"文本相似不能证明作者身份、许可证或权利转让"},{"id":"SUTI.game","title":"自愿练习","purpose":"通过NITYA和Samurai Dharma游戏探索技能","procedure":"选择日常或象征性语言 → 领取小任务 → 尝试 → 记录观察或跳过 → 决定是否继续","output":"练习经验及自己选择的下一步","boundary":"游戏自愿参与；可以暂停、跳过和退出；不同年龄路线须单独审查"},{"id":"SUTI.logos","title":"语言与跨语境转创","purpose":"在语言和场景之间转换时保留意义","procedure":"明确意图与不变量 → 直接从原文翻译 → 对照条件和确定程度 → 请求独立审校","output":"易懂文本、术语及每种语言版本的状态","boundary":"草稿不等于经过核查的译文；Язэхъ需要作者提供释义"},{"id":"SUTI.verenium","title":"关怀导航","purpose":"帮助人们选择可行的支持方式和自己的下一步行动","procedure":"询问重要之事 → 提供清晰选项 → 确认边界 → 保留选择、暂停和退出空间","output":"选定的帮助路线及商定的行动","boundary":"关怀天使是自愿采用的意象；服务不是急救或临床服务"}],"locale":"zh-hans","translation_state":"direct-source-draft-unreviewed","native_review":"pending","release":"HOLD","home_href":"../../../zh-hans/living-system.html","fund_href":"../../../zh-hans/care-90-days.html","contour_hrefs":{"SUTI.os":"../../../zh-hans/SUTI.os/living-system.html","SUTI.world":"../../../zh-hans/SUTI.world/living-system.html","SUTI.uni":"../../../zh-hans/SUTI.uni/living-system.html","SUTI.clan":"../../../zh-hans/SUTI.clan/living-system.html","SUTI.lab":"../../../zh-hans/SUTI.lab/living-system.html","SUTI.audit":"../../../zh-hans/SUTI.audit/living-system.html","SUTI.crystal":"../../../zh-hans/SUTI.crystal/living-system.html","SUTI.oracle":"../../../zh-hans/SUTI.oracle/living-system.html","SUTI.veche":"../../../zh-hans/SUTI.veche/living-system.html","SUTI.sotkan":"../../../zh-hans/SUTI.sotkan/living-system.html","SUTI.game":"../../../zh-hans/SUTI.game/living-system.html","SUTI.logos":"../../../zh-hans/SUTI.logos/living-system.html","SUTI.verenium":"../../../zh-hans/SUTI.verenium/living-system.html"}},"hi":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · साझा जीवंत प्रणाली","intro":"विधियों और सहयोग की एक सार्वजनिक प्रणाली: महत्वपूर्ण बात समझना, उसे व्यक्त करने के शब्द पाना और अगला संभव कदम चुनना। सहभागी का लेखकत्व तथा सुधारने, मना करने और बाहर निकलने का अधिकार बना रहता है।","status":"नई साझा कार्यपरत: स्थानीय संपादकीय मसौदा; स्वतंत्र भाषाई समीक्षा बाकी है; कानूनी रूप से स्थापित निधि, धन प्राप्ति, सक्रिय विश्वव्यापी नेटवर्क और प्रकाशन की पुष्टि नहीं हुई है","cycle":"प्रश्न → शब्द → संबंध → मानचित्र → कदम → अभिलेख → परिष्कार","privacy":"सार्वजनिक दायरे में विधियाँ, सामान्य निर्देश और जाँचे गए उदाहरण रहते हैं। निजी अभिलेख, संपर्क विवरण, पत्राचार और संवेदनशील जानकारी अलग रखी जाती है और साझा निर्यात में शामिल नहीं होती।","rights":"हर योगदान के लिए लेखकत्व, दृश्यता, लाइसेंस और अनुमत कार्रवाइयाँ अलग तय की जाती हैं। पूरे पुराने सामग्री-संग्रह का कोई प्रभावी लाइसेंस स्थापित नहीं है।","contribution":"स्रोत और कारण सहित बदलाव सुझाएँ → जाँच का तरीका बताएँ → प्रभावित सहभागियों की सहमति माँगें → जिम्मेदार व्यक्ति बदलाव स्वीकार करे या टाले → अभिलेख और पूर्व स्थिति में लौटने का तरीका सुरक्षित रखें","sovereignty":"सूचनात्मक स्वायत्तता: डेटा का स्रोत समझना और अपने अभिलेखों की पहुँच, निर्यात तथा विलोपन चुनना। भाषाई, शैक्षिक, रचनात्मक, आर्थिक और संगठनात्मक स्वावलंबन स्पष्ट कौशल और जाँचे जा सकने वाले निर्णयों से विकसित होता है; सफलता का वादा नहीं किया जाता।","fund_title":"जीवन और जीवनप्रेमियों की सहायता निधि · देखभाल के फ़रिश्तों की एजेंसी","fund_purpose":"उपयोगी पहलों के खुले समर्थन का प्रस्ताव: सीखना, सुलभ साधन, परस्पर सहायता और जीवंत पर्यावरण की देखभाल। नाम अस्थायी है; भागीदारी और फ़रिश्ते की छवि दोनों वैकल्पिक हैं।","fund_state":"स्थानीय तैयारी चक्र 2026-11-13 को शुरू हुआ। दिन 90 की तारीख 2027-02-10 है। पंजीकरण, क्षेत्राधिकार, प्रबंधक, बैंक, दान के नियम और कर व्यवस्था अभी UNKNOWN हैं; धन संबंधी लेनदेन सक्रिय नहीं किए गए हैं।","fund_flow":"संवेदनशील विवरणों के बिना खुला अनुरोध → उद्देश्य और उपलब्ध संसाधनों के अनुरूप होने की जाँच → हितों के टकराव के बिना निर्णय → सीमित सहायता → प्राप्तकर्ता की पहचान उजागर किए बिना परिणाम की पुष्टि → अपील और सुधार का अवसर","fund_phases":[["1–15","2026-11-13 — 2026-11-27","उद्देश्य, निर्णय लेने के जिम्मेदार व्यक्ति, पंजीकरण देश, भूमिकाओं का बँटवारा और भागीदारी की शर्तों पर सहमति बनाएँ; धन जुटाए बिना बजट मॉडल तैयार करें"],["16–30","2026-11-28 — 2026-12-12","कानूनी मार्ग और साझेदारी के विकल्प की जाँच करें; सहायता, हितों के टकराव, अपील, डेटा प्रसंस्करण और वित्तीय निगरानी के नियम तय करें"],["31–45","2026-12-13 — 2026-12-27","13 भाषाओं में सार्वजनिक निर्देश, सुलभ बॉट और फ़ॉर्म का प्रोटोटाइप तथा लघु पाठों का संग्रह तैयार करें; स्वतंत्र संपादकीय समीक्षा शुरू करें"],["46–60","2026-12-28 — 2027-01-11","आवश्यक अनुमतियों के बाद छोटा स्वैच्छिक पायलट चलाएँ; सहमति, सुगम्यता, उत्तर, तथा अपने डेटा के निर्यात और विलोपन की जाँच करें"],["61–75","2027-01-12 — 2027-01-26","पायलट का मूल्यांकन करें, कमियाँ सुधारें और स्थानीय साझेदार समूह तैयार करें; केवल पुष्ट प्रक्रियाओं का विस्तार करें"],["76–90","2027-01-27 — 2027-02-10","परिणामों को मानदंडों से मिलाएँ, अनुमति के बाद उपयुक्त अनाम रिपोर्ट प्रकाशित करें, तथा अगले चक्र और भौगोलिक क्षेत्र का निर्णय लें"]],"fund_roles":"कार्यक्रम का जिम्मेदार व्यक्ति; वित्त और स्वतंत्र मिलान; डेटा संरक्षण और सहभागी सुरक्षा; भाषा संपादक; पायलट समन्वयक; अपीलों की स्वतंत्र समीक्षा। ये प्रस्तावित भूमिकाएँ हैं; व्यक्तियों की नियुक्ति नहीं हुई है।","fund_metrics":"सहमति से हुई भागीदारी, पूरे किए गए उपयोगी कार्य, उत्तर देने का समय, सुगम्यता, सुधार और वास्तविक खर्च दर्ज करें। लक्ष्य और संख्यात्मक मानदंड पायलट से पहले मंजूर किए जाएँ; व्यापक प्रसार या विश्वव्यापी पहुँच की गारंटी नहीं है।","fund_pause":"पैसे और रिपोर्ट में अंतर, सहमति का उल्लंघन, डेटा का रिसाव, हानि की शिकायत या जिम्मेदार व्यक्ति का अभाव संबंधित प्रक्रिया को रोकने, समीक्षा करने और मानव निर्णय लेने का कारण बनता है।","contours":[{"id":"SUTI.os","title":"प्रणाली की संरचना","purpose":"सीमाओं, साधनों, संग्रहण और पुनर्स्थापन में समन्वय करना","procedure":"कार्य और दायरा चुनें → इनपुट और परिणाम बताएँ → पहुँच और वापसी जाँचें → कार्यनिर्देश सुरक्षित रखें","output":"परिवेश का मानचित्र और दोहराया जा सकने वाला कार्यकदम","boundary":"विवरण किसी स्थापित प्रणाली या सुरक्षा की पुष्टि नहीं करता"},{"id":"SUTI.world","title":"सार्वजनिक प्रवेश","purpose":"व्यक्ति को उपयुक्त दिशा और अगला कदम खोजने में मदद करना","procedure":"प्रश्न बताएँ → भाषा चुनें → उपयुक्त मॉड्यूल खोलें → एक संभव कदम आजमाएँ","output":"स्पष्ट मार्ग और चुनी हुई कार्रवाई","boundary":"नेटवर्क का आकार और उपयोगिता प्रेक्षणों से पुष्ट होते हैं, वादे से नहीं"},{"id":"SUTI.uni","title":"स्वाध्याय","purpose":"प्रश्न को छोटे सीखने के अभ्यास में बदलना","procedure":"कौशल बताएँ → एक उदाहरण पढ़ें → छोटा कार्य करें → अपनी भाषा में समझ की जाँच करें","output":"लघु पाठ, उदाहरण और प्रतिक्रिया","boundary":"सीखना पेशेवर सहायता या योग्यता का विकल्प नहीं है"},{"id":"SUTI.clan","title":"सहयोग","purpose":"भूमिका, योगदान और भागीदारी की सीमाओं पर सहमति बनाना","procedure":"साझा कार्य बताएँ → स्पष्ट भागीदारी माँगें → अधिकार और भूमिका तय करें → निर्णय सुरक्षित रखें","output":"सहभागियों की सहमति और जिम्मेदारियों का मानचित्र","boundary":"मानचित्र में किसी व्यक्ति या संगठन का नाम होने से साझेदारी या सहमति सिद्ध नहीं होती"},{"id":"SUTI.lab","title":"अनुसंधान","purpose":"छोटे और वापस लिए जा सकने वाले प्रयोगों से विचार जाँचना","procedure":"परिकल्पना बताएँ → दिखने वाला संकेत चुनें → सीमित प्रयोग करें → परिणाम और संदेह लिखें","output":"आधारों सहित अनुसंधान अभिलेख","boundary":"जाँच के बिना परिकल्पना या प्रतीक तथ्य नहीं बनते"},{"id":"SUTI.audit","title":"जाँच","purpose":"परिणाम को स्पष्ट मानदंड से मिलाना","procedure":"दायरा तय करें → मानदंड चुनें → सामग्री जाँचें → PASS, PARTIAL, FAIL या UNKNOWN दर्ज करें","output":"रिपोर्ट, साक्ष्य और खुले प्रश्न","boundary":"PASS केवल बताए गए संस्करण और जाँच पर लागू होता है"},{"id":"SUTI.crystal","title":"स्पष्ट रूप","purpose":"महत्वपूर्ण बात ऐसे दस्तावेज़ में सुरक्षित रखना जो अपने आप समझ में आए","procedure":"प्रश्न और स्रोत पहचानें → अपरिवर्तनीय मूल बताएँ → उदाहरण और सीमा दिखाएँ → अगला कदम जोड़ें","output":"स्रोत और संदर्भ सहित सार-कार्ड","boundary":"संक्षिप्तता के लिए शर्तें, लेखकत्व या अनिश्चितता खोना उचित नहीं है"},{"id":"SUTI.oracle","title":"आधारों में भेद","purpose":"जानकारी, व्याख्या और अज्ञात को अलग रखना","procedure":"दावा लिखें → उसका प्रकार बताएँ → आधार दें → जाँच का तरीका बताएँ","output":"दावों और आधारों का मानचित्र","boundary":"यह विचार करने की विधि है; भविष्यवाणी या स्वायत्त प्राधिकार नहीं"},{"id":"SUTI.veche","title":"साझा विचार-विमर्श","purpose":"प्रस्तावों और मतभेदों को स्पष्ट करना","procedure":"प्रस्ताव रखें → पक्ष माँगें → समर्थन, आपत्ति, मतदान से विरत रहना और उत्तर न मिलना अलग दर्ज करें → जिम्मेदार व्यक्ति निर्णय ले","output":"विचार-विमर्श का अभिलेख और मानव द्वारा लिया गया निर्णय","boundary":"चुप्पी सहमति नहीं है; AI की समीक्षा लोगों का मतदान नहीं मानी जाती"},{"id":"SUTI.sotkan","title":"संबंध और उत्पत्ति","purpose":"सामग्री को स्रोत और बदलाव के इतिहास से जोड़ना","procedure":"स्रोत बताएँ → रूपांतरण का वर्णन करें → संशोधन को मूल से जोड़ें → सुधार और वापसी की संभावना जाँचें","output":"उत्पत्ति का सत्यापन योग्य अभिलेख","boundary":"पाठ की समानता लेखकत्व, लाइसेंस या अधिकारों के हस्तांतरण को सिद्ध नहीं करती"},{"id":"SUTI.game","title":"स्वैच्छिक अभ्यास","purpose":"NITYA और Samurai Dharma खेलों के माध्यम से कौशल तलाशना","procedure":"सामान्य या प्रतीकात्मक भाषा चुनें → छोटा खोजकार्य लें → आजमाएँ → प्रेक्षण लिखें या छोड़ दें → आगे बढ़ने का विकल्प चुनें","output":"अभ्यास का अनुभव और अपना अगला कदम","boundary":"खेल स्वैच्छिक है; विराम, छोड़ना और बाहर निकलना संभव है; आयु-आधारित मार्गों की अलग समीक्षा जरूरी है"},{"id":"SUTI.logos","title":"भाषा और भावानुवाद","purpose":"भाषाओं और परिवेशों के बीच जाते समय अर्थ बनाए रखना","procedure":"आशय और अपरिवर्तनीय मूल पहचानें → सीधे स्रोत से अनुवाद करें → शर्तें और निश्चितता मिलाएँ → स्वतंत्र समीक्षा माँगें","output":"समझने योग्य पाठ, शब्दावली और हर भाषा-संस्करण की स्थिति","boundary":"मसौदा जाँचा हुआ अनुवाद नहीं है; Язэхъ के लिए लेखक की शब्दार्थ-सूची जरूरी है"},{"id":"SUTI.verenium","title":"देखभाल की राह","purpose":"व्यक्ति को अपनी सामर्थ्य के अनुसार सहायता और अपना कदम चुनने में मदद करना","procedure":"पूछें कि क्या महत्वपूर्ण है → स्पष्ट विकल्प दें → सीमाएँ समझें → चयन, विराम और बाहर निकलने की गुंजाइश रखें","output":"चुना हुआ सहायता मार्ग और सहमत कार्रवाई","boundary":"देखभाल का फ़रिश्ता एक वैकल्पिक छवि है; सेवा आपातकालीन या चिकित्सकीय सेवा नहीं है"}],"locale":"hi","translation_state":"direct-source-draft-unreviewed","native_review":"pending","release":"HOLD","home_href":"../../../hi/living-system.html","fund_href":"../../../hi/care-90-days.html","contour_hrefs":{"SUTI.os":"../../../hi/SUTI.os/living-system.html","SUTI.world":"../../../hi/SUTI.world/living-system.html","SUTI.uni":"../../../hi/SUTI.uni/living-system.html","SUTI.clan":"../../../hi/SUTI.clan/living-system.html","SUTI.lab":"../../../hi/SUTI.lab/living-system.html","SUTI.audit":"../../../hi/SUTI.audit/living-system.html","SUTI.crystal":"../../../hi/SUTI.crystal/living-system.html","SUTI.oracle":"../../../hi/SUTI.oracle/living-system.html","SUTI.veche":"../../../hi/SUTI.veche/living-system.html","SUTI.sotkan":"../../../hi/SUTI.sotkan/living-system.html","SUTI.game":"../../../hi/SUTI.game/living-system.html","SUTI.logos":"../../../hi/SUTI.logos/living-system.html","SUTI.verenium":"../../../hi/SUTI.verenium/living-system.html"}},"fr":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · un système vivant partagé","intro":"un système public de méthodes et de coopération : comprendre ce qui compte, trouver les mots et choisir une étape accessible. Chaque personne conserve son rôle d’auteur et le droit de corriger, de refuser et de partir.","status":"nouvelle couche opérationnelle commune : brouillon éditorial local ; révision linguistique indépendante en attente ; la constitution juridique d’un fonds, la réception d’argent, un réseau mondial opérationnel et la publication ne sont pas confirmés","cycle":"question → mots → liens → carte → étape → trace → précision","privacy":"l’espace public conserve les méthodes, les instructions générales et les exemples vérifiés. Les notes personnelles, coordonnées, correspondances et informations sensibles sont conservées séparément et exclues de l’export commun.","rights":"l’attribution, la visibilité, la licence et les actions permises sont définies séparément pour chaque contribution. Aucune licence applicable à l’ensemble du corpus ancien n’a été établie.","contribution":"proposer une modification avec sa source et sa raison → décrire la vérification → demander l’accord des personnes concernées → la personne responsable accepte ou reporte la modification → conserver la trace et la possibilité de revenir en arrière","sovereignty":"souveraineté informationnelle : comprendre la provenance des données et choisir l’accès, l’export et la suppression de ses propres notes. L’autonomie linguistique, éducative, créative, économique et organisationnelle se développe par des compétences compréhensibles et des décisions vérifiables ; aucun résultat n’est promis.","fund_title":"fonds de soutien à la vie et aux personnes qui aiment la vie · agence des anges de sollicitude","fund_purpose":"projet de soutien ouvert à des initiatives utiles : apprentissage, outils accessibles, entraide et soin du milieu vivant. Le nom est provisoire ; la participation et l’image de l’ange sont facultatives.","fund_state":"le cycle local de préparation a commencé le 13 novembre 2026. Le jour 90 est le 10 février 2027. L’enregistrement, la juridiction, les responsables, la banque, les règles de dons et le régime fiscal sont encore UNKNOWN ; aucune opération financière n’est activée.","fund_flow":"demande ouverte sans détails sensibles → vérifier l’adéquation à l’objectif et aux ressources disponibles → décision sans conflit d’intérêts → soutien limité → confirmer le résultat sans dévoiler le bénéficiaire → possibilité de recours et de correction","fund_phases":[["1–15","2026-11-13 — 2026-11-27","s’accorder sur l’objectif, la responsabilité des décisions, le pays d’enregistrement, la répartition des rôles et les conditions de participation ; élaborer un modèle budgétaire sans collecter d’argent"],["16–30","2026-11-28 — 2026-12-12","vérifier le parcours juridique et l’option d’un partenaire ; s’accorder sur les règles de soutien, de conflits d’intérêts, de recours, de traitement des données et de contrôle financier"],["31–45","2026-12-13 — 2026-12-27","assembler les instructions publiques en 13 langues, un prototype accessible du bot et du formulaire ainsi qu’une bibliothèque de microleçons ; commencer la révision indépendante"],["46–60","2026-12-28 — 2027-01-11","mener un petit pilote volontaire après les autorisations nécessaires ; vérifier le consentement, l’accessibilité, les réponses, l’export et la suppression de ses propres données"],["61–75","2027-01-12 — 2027-01-26","évaluer le pilote, corriger les défauts, préparer des groupes de partenaires locaux ; étendre seulement les processus confirmés"],["76–90","2027-01-27 — 2027-02-10","comparer les résultats aux critères, publier un rapport anonymisé autorisé après accord, décider du prochain cycle et des zones géographiques"]],"fund_roles":"responsable du programme ; finances et rapprochement indépendant ; protection des données et sécurité des participants ; réviseurs linguistiques ; coordinateurs du pilote ; examen indépendant des recours. Les rôles sont proposés ; personne n’est nommé.","fund_metrics":"suivre la participation consentie, les actions utiles réalisées, le délai de réponse, l’accessibilité, les corrections et les dépenses réelles. Les objectifs et les seuils chiffrés sont approuvés avant le pilote ; ni la viralité ni une portée mondiale ne sont garanties.","fund_pause":"un écart entre les fonds et le rapport, une violation du consentement, une fuite, une plainte pour préjudice ou l’absence de responsable entraîne une pause du processus concerné, un examen et une décision humaine.","contours":[{"id":"SUTI.os","title":"organisation du système","purpose":"s’accorder sur les limites, les outils, le stockage et la restauration","procedure":"choisir une tâche et un espace → décrire l’entrée et le résultat → vérifier l’accès et le retour → conserver une instruction de travail","output":"carte de l’environnement et étape de travail reproductible","boundary":"une description ne confirme ni une installation ni sa sécurité"},{"id":"SUTI.world","title":"entrée publique","purpose":"aider une personne à trouver la bonne direction et une prochaine étape","procedure":"nommer la question → choisir la langue → ouvrir le module adapté → essayer une étape accessible","output":"parcours compréhensible et action choisie","boundary":"l’étendue du réseau et son utilité se confirment par des observations, pas par une promesse"},{"id":"SUTI.uni","title":"apprentissage autonome","purpose":"transformer une question en une courte pratique d’apprentissage","procedure":"formuler la compétence → étudier un exemple → réaliser une petite tâche → vérifier la compréhension avec ses propres mots","output":"microleçon, exemple et retour","boundary":"l’apprentissage ne remplace ni une aide professionnelle ni une qualification"},{"id":"SUTI.clan","title":"coopération","purpose":"s’accorder sur les rôles, les contributions et les limites de participation","procedure":"formuler le projet commun → demander une participation explicite → convenir des droits et du rôle → conserver la décision","output":"accord des participants et carte des responsabilités","boundary":"le nom d’une personne ou d’une organisation sur une carte ne signifie ni partenariat ni consentement"},{"id":"SUTI.lab","title":"recherche","purpose":"éprouver les idées par de petites expériences réversibles","procedure":"nommer l’hypothèse → choisir un signe observable → mener une expérience limitée → noter le résultat et les doutes","output":"note de recherche avec ses fondements","boundary":"une hypothèse ou un symbole ne devient pas un fait sans vérification"},{"id":"SUTI.audit","title":"vérification","purpose":"comparer un résultat à un critère explicite","procedure":"définir le périmètre → choisir le critère → examiner le matériau → consigner PASS, PARTIAL, FAIL ou UNKNOWN","output":"rapport, éléments probants et questions ouvertes","boundary":"PASS s’applique uniquement à la version et à la vérification nommées"},{"id":"SUTI.crystal","title":"forme claire","purpose":"préserver l’essentiel dans un document compréhensible de manière autonome","procedure":"isoler la question et la source → nommer l’invariant → montrer un exemple et une limite → ajouter une prochaine étape","output":"fiche de l’essentiel avec source et contexte","boundary":"la brièveté ne justifie pas la perte des conditions, de l’attribution ou de l’incertitude"},{"id":"SUTI.oracle","title":"distinction des fondements","purpose":"distinguer les informations, les interprétations et l’inconnu","procedure":"formuler l’énoncé → nommer son type → indiquer son fondement → décrire le moyen de le vérifier","output":"carte des énoncés et de leurs fondements","boundary":"c’est une méthode d’examen, sans prédiction ni autorité autonome"},{"id":"SUTI.veche","title":"examen collectif","purpose":"rendre visibles les propositions et les désaccords","procedure":"présenter la proposition → solliciter les positions → noter séparément soutien, objection, abstention et absence de réponse → la personne responsable décide","output":"registre de l’examen et décision humaine","boundary":"le silence ne vaut pas consentement ; un examen par IA ne constitue pas un vote humain"},{"id":"SUTI.sotkan","title":"liens et provenance","purpose":"relier les matériaux à leurs sources et à leur historique de modification","procedure":"indiquer la source → décrire la transformation → relier la version à l’original → vérifier la possibilité de corriger et de revenir en arrière","output":"trace de provenance vérifiable","boundary":"la similitude de texte ne prouve ni attribution, ni licence, ni cession de droits"},{"id":"SUTI.game","title":"pratique volontaire","purpose":"explorer des compétences par le jeu NITYA et Samurai Dharma","procedure":"choisir un langage ordinaire ou symbolique → prendre une petite quête → essayer → noter une observation ou passer → choisir la suite","output":"expérience de pratique et prochaine étape choisie","boundary":"le jeu est volontaire ; pause, passage et sortie sont disponibles ; les parcours d’âge demandent une vérification distincte"},{"id":"SUTI.logos","title":"langage et transcréation","purpose":"préserver le sens lors du passage entre langues et environnements","procedure":"isoler l’intention et l’invariant → traduire directement depuis la source → comparer les conditions et le degré de certitude → demander une révision indépendante","output":"texte compréhensible, termes et statut de chaque langue","boundary":"un brouillon n’est pas une traduction vérifiée ; Yazekh exige une glose de l’auteur"},{"id":"SUTI.verenium","title":"orientation dans le soutien","purpose":"aider une personne à choisir un soutien à sa portée et sa propre étape","procedure":"demander ce qui compte → proposer des options compréhensibles → préciser les limites → laisser le choix, la pause et la sortie","output":"parcours de soutien choisi et action convenue","boundary":"l’ange de sollicitude est une image facultative ; le service n’est ni un service d’urgence ni un service clinique"}],"locale":"fr","editorial_status":"AI-assisted-draft; independent-native-and-semantic-review-pending","translation_state":"direct-source-draft-unreviewed","native_review":"pending","release":"HOLD","home_href":"../../../fr/living-system.html","fund_href":"../../../fr/care-90-days.html","contour_hrefs":{"SUTI.os":"../../../fr/SUTI.os/living-system.html","SUTI.world":"../../../fr/SUTI.world/living-system.html","SUTI.uni":"../../../fr/SUTI.uni/living-system.html","SUTI.clan":"../../../fr/SUTI.clan/living-system.html","SUTI.lab":"../../../fr/SUTI.lab/living-system.html","SUTI.audit":"../../../fr/SUTI.audit/living-system.html","SUTI.crystal":"../../../fr/SUTI.crystal/living-system.html","SUTI.oracle":"../../../fr/SUTI.oracle/living-system.html","SUTI.veche":"../../../fr/SUTI.veche/living-system.html","SUTI.sotkan":"../../../fr/SUTI.sotkan/living-system.html","SUTI.game":"../../../fr/SUTI.game/living-system.html","SUTI.logos":"../../../fr/SUTI.logos/living-system.html","SUTI.verenium":"../../../fr/SUTI.verenium/living-system.html"}},"ar":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · منظومة حيّة مشتركة","intro":"منظومة عامة للمناهج والعمل المشترك: فهم ما يهم، وإيجاد الكلمات، واختيار خطوة تالية ممكنة. يحتفظ المشارك بصفته صاحب المساهمة وبحقه في التصحيح والرفض والانسحاب.","status":"طبقة تشغيلية مشتركة جديدة: مسودة تحريرية محلية؛ المراجعة اللغوية المستقلة معلّقة؛ لم يتأكد التأسيس القانوني للصندوق أو استقبال الأموال أو وجود شبكة عالمية عاملة أو النشر","cycle":"سؤال ← كلمات ← روابط ← خريطة ← خطوة ← سجل ← تنقيح","privacy":"يقتصر الحيّز العام على المناهج والتعليمات العامة والأمثلة التي خضعت للفحص. تُحفظ السجلات الشخصية وبيانات الاتصال والمراسلات والمعلومات الحساسة منفصلة، ولا تُدرج في التصدير المشترك.","rights":"تُحدَّد نسبة التأليف ونطاق الظهور والترخيص والإجراءات المسموح بها لكل مساهمة على حدة. لم يُثبت ترخيص ساري المفعول يشمل كامل المحتوى القديم.","contribution":"اقترح تعديلاً مع المصدر والسبب ← وضّح طريقة الفحص ← اطلب موافقة المشاركين المتأثرين ← يقبل الشخص المسؤول التعديل أو يؤجله ← احفظ السجل وإمكانية الرجوع","sovereignty":"السيادة المعلوماتية: فهم أصل البيانات واختيار الوصول إلى سجلاتك وتصديرها وحذفها. تُنمّى الاستقلالية اللغوية والتعليمية والإبداعية والاقتصادية والتنظيمية عبر مهارات مفهومة وقرارات قابلة للتحقق؛ ولا يُضمن تحققها.","fund_title":"صندوق دعم الحياة ومحبّي الحياة · وكالة ملائكة الرعاية","fund_purpose":"مشروع دعم مفتوح للمبادرات المفيدة: التعلّم، والأدوات الميسّرة، والتكافل، ورعاية البيئة الحيّة. الاسم مبدئي؛ المشاركة وصورة الملاك اختياريتان.","fund_state":"بدأت دورة التحضير المحلية في 2026-11-13. اليوم 90 يوافق 2027-02-10. التسجيل والاختصاص القانوني والإدارة والبنك وقواعد التبرعات والنظام الضريبي ما زالت UNKNOWN؛ ولم تُفعَّل المعاملات المالية.","fund_flow":"طلب مفتوح دون تفاصيل حساسة ← فحص توافقه مع الهدف والموارد المتاحة ← قرار دون تضارب مصالح ← دعم محدود ← تأكيد النتيجة دون كشف المستفيد ← إتاحة الاعتراض والتصحيح","fund_phases":[["1–15","2026-11-13 — 2026-11-27","الاتفاق على الهدف ومسؤول القرار وبلد التسجيل وتوزيع الأدوار وشروط المشاركة؛ إعداد نموذج ميزانية دون جمع الأموال"],["16–30","2026-11-28 — 2026-12-12","فحص المسار القانوني وخيار الشراكة؛ الاتفاق على قواعد الدعم وتضارب المصالح والاعتراضات ومعالجة البيانات والرقابة المالية"],["31–45","2026-12-13 — 2026-12-27","إعداد تعليمات عامة بثلاث عشرة لغة ونموذج أولي ميسّر للبوت والنموذج الإلكتروني ومكتبة دروس مصغّرة؛ بدء مراجعة تحريرية مستقلة"],["46–60","2026-12-28 — 2027-01-11","إجراء تجربة صغيرة طوعية بعد الحصول على الأذونات اللازمة؛ فحص الموافقة وإمكانية الوصول والاستجابات وتصدير البيانات الشخصية وحذفها"],["61–75","2027-01-12 — 2027-01-26","تقييم التجربة وإصلاح العيوب وإعداد مجموعات شريكة محلية؛ توسيع العمليات التي تأكدت صلاحيتها فقط"],["76–90","2027-01-27 — 2027-02-10","مقارنة النتائج بالمعايير، ونشر تقرير مسموح به ومجهّل الهوية بعد الإذن، واتخاذ قرار بشأن الدورة التالية ونطاقها الجغرافي"]],"fund_roles":"مسؤول البرنامج؛ الشؤون المالية والمطابقة المستقلة؛ حماية البيانات وسلامة المشاركين؛ محررون لغويون؛ منسقو التجربة المحدودة؛ مراجعة مستقلة للاعتراضات. الأدوار مقترحة ولم يُعيَّن أشخاص لها.","fund_metrics":"تسجيل المشاركة المتفق عليها والأعمال المفيدة المنجزة وزمن الاستجابة وإمكانية الوصول والتصحيحات والنفقات الفعلية. تُعتمد الأهداف والحدود العددية قبل التجربة؛ ولا يُضمن الانتشار الواسع أو الوصول العالمي.","fund_pause":"اختلاف الأموال عن التقرير، أو انتهاك الموافقة، أو تسرب البيانات، أو شكوى بشأن ضرر، أو غياب المسؤول يستدعي إيقاف العملية المعنية مؤقتاً ومراجعتها واتخاذ قرار بشري.","contours":[{"id":"SUTI.os","title":"بنية المنظومة","purpose":"تنسيق الحدود والأدوات والتخزين والاستعادة","procedure":"اختر المهمة والحيّز ← صِف المدخل والنتيجة ← افحص الوصول والرجوع ← احفظ تعليمات العمل","output":"خريطة للبيئة وخطوة عمل قابلة للتكرار","boundary":"الوصف لا يؤكد تثبيت نظام أو تحقق الأمان"},{"id":"SUTI.world","title":"المدخل العام","purpose":"مساعدة الشخص في إيجاد الاتجاه المناسب والخطوة التالية","procedure":"حدّد السؤال ← اختر اللغة ← افتح الوحدة المناسبة ← جرّب خطوة ممكنة","output":"مسار مفهوم وفعل مختار","boundary":"حجم الشبكة والفائدة يثبتان بالملاحظات لا بالوعد"},{"id":"SUTI.uni","title":"التعلّم الذاتي","purpose":"تحويل السؤال إلى تمرين تعلّم قصير","procedure":"حدّد المهارة ← ادرس مثالاً واحداً ← أنجز مهمة صغيرة ← اختبر فهمك بكلماتك","output":"درس مصغّر ومثال وتغذية راجعة","boundary":"التعلّم لا يحل محل المساعدة المهنية أو التأهيل"},{"id":"SUTI.clan","title":"التعاون","purpose":"الاتفاق على الأدوار والمساهمات وحدود المشاركة","procedure":"صِف العمل المشترك ← اطلب مشاركة صريحة ← اتفق على الحقوق والدور ← احفظ القرار","output":"اتفاق المشاركين وخريطة المسؤولية","boundary":"وجود اسم شخص أو منظمة في الخريطة لا يعني شراكة أو موافقة"},{"id":"SUTI.lab","title":"البحث","purpose":"اختبار الأفكار بتجارب صغيرة قابلة للتراجع","procedure":"حدّد الفرضية ← اختر مؤشراً يمكن ملاحظته ← أجرِ تجربة محدودة ← سجّل النتيجة والشكوك","output":"سجل بحثي مع أسانيده","boundary":"الفرضية والرمز لا يصبحان حقيقة دون تحقق"},{"id":"SUTI.audit","title":"الفحص","purpose":"مقارنة النتيجة بمعيار صريح","procedure":"حدّد النطاق ← اختر المعيار ← افحص المادة ← سجّل PASS أو PARTIAL أو FAIL أو UNKNOWN","output":"تقرير وأدلة وأسئلة مفتوحة","boundary":"تسري PASS على النسخة والفحص المحددين فقط"},{"id":"SUTI.crystal","title":"صياغة واضحة","purpose":"حفظ الجوهري في مادة يمكن فهمها بصورة مستقلة","procedure":"حدّد السؤال والمصدر ← سمِّ الجوهر الثابت ← قدّم مثالاً وحدّاً ← أضف الخطوة التالية","output":"بطاقة للجوهر مع المصدر والسياق","boundary":"الإيجاز لا يبرر فقدان الشروط أو نسبة التأليف أو عدم اليقين"},{"id":"SUTI.oracle","title":"تمييز الأسانيد","purpose":"الفصل بين المعلومات والتفسيرات والمجهول","procedure":"صُغ الادعاء ← حدّد نوعه ← اذكر سنده ← صِف طريقة التحقق","output":"خريطة للادعاءات وأسانيدها","boundary":"هذه طريقة للنظر، وليست تنبؤاً أو سلطة مستقلة"},{"id":"SUTI.veche","title":"النظر المشترك","purpose":"إظهار المقترحات والخلافات","procedure":"اعرض المقترح ← اطلب المواقف ← سجّل التأييد والاعتراض والامتناع وعدم الرد كلّاً على حدة ← يتخذ الشخص المسؤول القرار","output":"سجل للنظر وقرار يتخذه إنسان","boundary":"الصمت ليس موافقة؛ ولا تُعد مراجعة AI تصويتاً بشرياً"},{"id":"SUTI.sotkan","title":"الروابط والمنشأ","purpose":"ربط المواد بمصادرها وتاريخ تعديلها","procedure":"اذكر المصدر ← صِف التحويل ← اربط النسخة المنقحة بالأصل ← افحص إمكانية التصحيح والرجوع","output":"سجل منشأ قابل للتحقق","boundary":"تشابه النصوص لا يثبت التأليف أو الترخيص أو نقل الحقوق"},{"id":"SUTI.game","title":"ممارسة طوعية","purpose":"استكشاف المهارات عبر لعبتَي NITYA وSamurai Dharma","procedure":"اختر لغة عادية أو رمزية ← اختر مهمة صغيرة ← جرّب ← سجّل ملاحظة أو تجاوز ← اختر الاستمرار","output":"خبرة ممارسة وخطوتك التالية","boundary":"اللعب طوعي؛ يمكن التوقف مؤقتاً والتجاوز والانسحاب؛ وتتطلب المسارات العمرية مراجعة منفصلة"},{"id":"SUTI.logos","title":"اللغة وإعادة الصياغة عبر اللغات","purpose":"حفظ المعنى عند الانتقال بين اللغات والبيئات","procedure":"حدّد القصد والجوهر الثابت ← ترجم مباشرة من المصدر ← قارن الشروط ودرجة اليقين ← اطلب مراجعة مستقلة","output":"نص مفهوم ومصطلحات وحالة لكل نسخة لغوية","boundary":"المسودة ليست ترجمة متحقَّقاً منها؛ وتتطلب Язэхъ شرحاً معجمياً من المؤلف"},{"id":"SUTI.verenium","title":"إرشاد الرعاية","purpose":"مساعدة الشخص في اختيار مساعدة ضمن قدرته وخطوته الخاصة","procedure":"اسأل عمّا يهم ← اقترح خيارات مفهومة ← وضّح الحدود ← اترك حرية الاختيار والتوقف والانسحاب","output":"مسار مساعدة مختار وفعل متفق عليه","boundary":"ملاك الرعاية صورة اختيارية؛ والخدمة ليست خدمة طوارئ أو خدمة سريرية"}],"locale":"ar","translation_state":"direct-source-draft-unreviewed","native_review":"pending","release":"HOLD","home_href":"../../../ar/living-system.html","fund_href":"../../../ar/care-90-days.html","contour_hrefs":{"SUTI.os":"../../../ar/SUTI.os/living-system.html","SUTI.world":"../../../ar/SUTI.world/living-system.html","SUTI.uni":"../../../ar/SUTI.uni/living-system.html","SUTI.clan":"../../../ar/SUTI.clan/living-system.html","SUTI.lab":"../../../ar/SUTI.lab/living-system.html","SUTI.audit":"../../../ar/SUTI.audit/living-system.html","SUTI.crystal":"../../../ar/SUTI.crystal/living-system.html","SUTI.oracle":"../../../ar/SUTI.oracle/living-system.html","SUTI.veche":"../../../ar/SUTI.veche/living-system.html","SUTI.sotkan":"../../../ar/SUTI.sotkan/living-system.html","SUTI.game":"../../../ar/SUTI.game/living-system.html","SUTI.logos":"../../../ar/SUTI.logos/living-system.html","SUTI.verenium":"../../../ar/SUTI.verenium/living-system.html"}},"bn":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · যৌথ জীবন্ত ব্যবস্থা","intro":"পদ্ধতি ও যৌথ কাজের একটি উন্মুক্ত ব্যবস্থা: গুরুত্বপূর্ণ বিষয় বোঝা, প্রকাশের ভাষা খুঁজে পাওয়া এবং পরের সম্ভব পদক্ষেপ বেছে নেওয়া। অংশগ্রহণকারীর লেখকত্ব এবং সংশোধন, প্রত্যাখ্যান ও সরে যাওয়ার অধিকার অক্ষুণ্ণ থাকে।","status":"নতুন যৌথ কার্যপরিচালনা স্তর: স্থানীয় সম্পাদনাগত খসড়া; স্বাধীন ভাষা পর্যালোচনা বাকি; আইনগত তহবিল, অর্থ গ্রহণ, কার্যকর বিশ্বব্যাপী নেটওয়ার্ক এবং প্রকাশ নিশ্চিত হয়নি","cycle":"প্রশ্ন → শব্দ → সংযোগ → মানচিত্র → পদক্ষেপ → নথি → পরিমার্জন","privacy":"উন্মুক্ত পরিসরে থাকে পদ্ধতি, সাধারণ নির্দেশনা ও যাচাই করা উদাহরণ। ব্যক্তিগত নথি, যোগাযোগের তথ্য, চিঠিপত্র ও সংবেদনশীল তথ্য আলাদা রাখা হয় এবং যৌথ রপ্তানিতে অন্তর্ভুক্ত হয় না।","rights":"প্রতিটি অবদানের লেখকত্ব, দৃশ্যমানতা, লাইসেন্স ও অনুমোদিত কাজ আলাদাভাবে নির্ধারিত হয়। সম্পূর্ণ পুরোনো উপাদানসম্ভারের জন্য কার্যকর কোনো লাইসেন্স প্রতিষ্ঠিত হয়নি।","contribution":"উৎস ও কারণসহ পরিবর্তনের প্রস্তাব দিন → যাচাইয়ের পদ্ধতি বর্ণনা করুন → প্রভাবিত অংশগ্রহণকারীদের সম্মতি চান → দায়িত্বপ্রাপ্ত ব্যক্তি পরিবর্তন গ্রহণ করবেন বা স্থগিত রাখবেন → নথি ও আগের অবস্থায় ফেরার উপায় সংরক্ষণ করুন","sovereignty":"তথ্যগত সার্বভৌমত্ব: তথ্যের উৎস বোঝা এবং নিজের নথির প্রবেশাধিকার, রপ্তানি ও মুছে ফেলার বিষয়ে সিদ্ধান্ত নেওয়া। ভাষাগত, শিক্ষাগত, সৃজনশীল, অর্থনৈতিক ও সাংগঠনিক স্বনির্ভরতা বোধগম্য দক্ষতা ও যাচাইযোগ্য সিদ্ধান্তের মাধ্যমে বিকশিত হয়; সাফল্যের প্রতিশ্রুতি দেওয়া হয় না।","fund_title":"জীবন ও জীবনপ্রেমীদের সহায়তা তহবিল · যত্নের দেবদূতদের সংস্থা","fund_purpose":"উপকারী উদ্যোগে উন্মুক্ত সহায়তার একটি প্রকল্প: শিক্ষা, সবার ব্যবহারোপযোগী সরঞ্জাম, পারস্পরিক সহায়তা এবং জীবন্ত পরিবেশের যত্ন। নামটি প্রস্তাবিত; অংশগ্রহণ ও দেবদূতের প্রতীক দুটিই ঐচ্ছিক।","fund_state":"স্থানীয় প্রস্তুতি চক্র শুরু হয়েছে 2026-11-13 তারিখে। ৯০তম দিন হলো 2027-02-10। নিবন্ধন, আইনগত এখতিয়ার, পরিচালনাকারী, ব্যাংক, অনুদানের নিয়ম ও করব্যবস্থা এখনও UNKNOWN; আর্থিক লেনদেন চালু করা হয়নি।","fund_flow":"সংবেদনশীল বিবরণ ছাড়া উন্মুক্ত অনুরোধ → লক্ষ্য ও উপলব্ধ সম্পদের সঙ্গে সামঞ্জস্য যাচাই → স্বার্থের সংঘাত ছাড়া সিদ্ধান্ত → সীমিত সহায়তা → গ্রহীতার পরিচয় প্রকাশ না করে ফল নিশ্চিতকরণ → আপিল ও সংশোধনের সুযোগ","fund_phases":[["1–15","2026-11-13 — 2026-11-27","লক্ষ্য, সিদ্ধান্তের দায়িত্বপ্রাপ্ত ব্যক্তি, নিবন্ধনের দেশ, ভূমিকা বণ্টন ও অংশগ্রহণের শর্তে সম্মত হন; অর্থ সংগ্রহ না করে বাজেটের মডেল তৈরি করুন"],["16–30","2026-11-28 — 2026-12-12","আইনগত পথ ও অংশীদারিত্বের বিকল্প যাচাই করুন; সহায়তা, স্বার্থের সংঘাত, আপিল, তথ্য প্রক্রিয়াকরণ ও আর্থিক তদারকির নিয়ম নির্ধারণ করুন"],["31–45","2026-12-13 — 2026-12-27","১৩ ভাষায় উন্মুক্ত নির্দেশনা, ব্যবহারসুগম বট ও ফর্মের প্রোটোটাইপ এবং ছোট পাঠের সংগ্রহ তৈরি করুন; স্বাধীন সম্পাদনাগত পর্যালোচনা শুরু করুন"],["46–60","2026-12-28 — 2027-01-11","প্রয়োজনীয় অনুমতির পরে ছোট স্বেচ্ছামূলক পরীক্ষামূলক কার্যক্রম চালান; সম্মতি, ব্যবহারসুগমতা, উত্তর এবং নিজের তথ্য রপ্তানি ও মুছে ফেলার ব্যবস্থা যাচাই করুন"],["61–75","2027-01-12 — 2027-01-26","পরীক্ষামূলক কার্যক্রম মূল্যায়ন করুন, ত্রুটি সংশোধন করুন এবং স্থানীয় অংশীদার দল প্রস্তুত করুন; কেবল যাচাই করা প্রক্রিয়ার বিস্তার ঘটান"],["76–90","2027-01-27 — 2027-02-10","ফলাফলের সঙ্গে মানদণ্ড মিলিয়ে দেখুন, অনুমতির পরে গ্রহণযোগ্য পরিচয়হীন প্রতিবেদন প্রকাশ করুন এবং পরবর্তী চক্র ও ভৌগোলিক পরিসর সম্পর্কে সিদ্ধান্ত নিন"]],"fund_roles":"কর্মসূচির দায়িত্বপ্রাপ্ত ব্যক্তি; অর্থব্যবস্থা ও স্বাধীন হিসাব মিলানো; তথ্য সুরক্ষা ও অংশগ্রহণকারীদের নিরাপত্তা; ভাষা সম্পাদক; পরীক্ষামূলক কার্যক্রমের সমন্বয়কারী; আপিলের স্বাধীন পর্যালোচনা। ভূমিকাগুলো প্রস্তাবিত; কাউকে নিয়োগ করা হয়নি।","fund_metrics":"সম্মত অংশগ্রহণ, সম্পন্ন উপকারী কাজ, উত্তর দেওয়ার সময়, ব্যবহারসুগমতা, সংশোধন এবং প্রকৃত ব্যয় নথিবদ্ধ করুন। লক্ষ্য ও সংখ্যাগত সীমা পরীক্ষামূলক কার্যক্রমের আগে অনুমোদিত হবে; ভাইরাল বিস্তার বা বিশ্বব্যাপী পৌঁছানো নিশ্চিত নয়।","fund_pause":"তহবিলের অর্থ ও প্রতিবেদনের অমিল, সম্মতির লঙ্ঘন, তথ্য ফাঁস, ক্ষতির অভিযোগ বা দায়িত্বপ্রাপ্ত ব্যক্তির অনুপস্থিতি সংশ্লিষ্ট প্রক্রিয়ায় বিরতি, পর্যালোচনা এবং মানুষের সিদ্ধান্তের কারণ হবে।","contours":[{"id":"SUTI.os","title":"ব্যবস্থার কাঠামো","purpose":"সীমা, সরঞ্জাম, সংরক্ষণ ও পুনরুদ্ধারে সামঞ্জস্য আনা","procedure":"কাজ ও পরিসর বাছুন → ইনপুট ও ফল বর্ণনা করুন → প্রবেশাধিকার ও ফেরার পথ যাচাই করুন → কাজের নির্দেশনা সংরক্ষণ করুন","output":"পরিবেশের মানচিত্র ও পুনরাবৃত্তিযোগ্য কাজের পদক্ষেপ","boundary":"বর্ণনা কোনো স্থাপিত ব্যবস্থা বা নিরাপত্তা নিশ্চিত করে না"},{"id":"SUTI.world","title":"উন্মুক্ত প্রবেশপথ","purpose":"মানুষকে উপযুক্ত দিক ও পরের পদক্ষেপ খুঁজে পেতে সাহায্য করা","procedure":"প্রশ্ন বলুন → ভাষা বাছুন → উপযুক্ত মডিউল খুলুন → একটি সম্ভব পদক্ষেপ চেষ্টা করুন","output":"বোধগম্য পথ ও বেছে নেওয়া কাজ","boundary":"নেটওয়ার্কের পরিসর ও উপকার পর্যবেক্ষণ দিয়ে নিশ্চিত করতে হয়, প্রতিশ্রুতি দিয়ে নয়"},{"id":"SUTI.uni","title":"স্বশিক্ষা","purpose":"প্রশ্নকে ছোট শেখার অনুশীলনে রূপ দেওয়া","procedure":"দক্ষতা নির্ধারণ করুন → একটি উদাহরণ পড়ুন → ছোট কাজ করুন → নিজের ভাষায় বোঝাপড়া যাচাই করুন","output":"ছোট পাঠ, উদাহরণ ও প্রতিক্রিয়া","boundary":"শিক্ষা পেশাদার সহায়তা বা যোগ্যতার বিকল্প নয়"},{"id":"SUTI.clan","title":"সহযোগিতা","purpose":"ভূমিকা, অবদান ও অংশগ্রহণের সীমায় সম্মত হওয়া","procedure":"যৌথ কাজ নির্ধারণ করুন → স্পষ্ট অংশগ্রহণ চান → অধিকার ও ভূমিকা ঠিক করুন → সিদ্ধান্ত সংরক্ষণ করুন","output":"অংশগ্রহণকারীদের চুক্তি ও দায়িত্বের মানচিত্র","boundary":"মানচিত্রে ব্যক্তি বা প্রতিষ্ঠানের নাম থাকলেই অংশীদারিত্ব বা সম্মতি বোঝায় না"},{"id":"SUTI.lab","title":"গবেষণা","purpose":"ছোট, ফিরিয়ে নেওয়া যায় এমন পরীক্ষায় ধারণা যাচাই করা","procedure":"অনুমান বলুন → পর্যবেক্ষণযোগ্য সূচক বাছুন → সীমিত পরীক্ষা করু
