ন → ফল ও সংশয় লিখুন","output":"ভিত্তিসহ গবেষণার নথি","boundary":"যাচাই ছাড়া অনুমান ও প্রতীক সত্য হয়ে ওঠে না"},{"id":"SUTI.audit","title":"যাচাই","purpose":"স্পষ্ট মানদণ্ডের সঙ্গে ফল মেলানো","procedure":"পরিসর ঠিক করুন → মানদণ্ড বাছুন → উপাদান যাচাই করুন → PASS, PARTIAL, FAIL বা UNKNOWN লিখুন","output":"প্রতিবেদন, প্রমাণ ও অমীমাংসিত প্রশ্ন","boundary":"PASS কেবল নির্দিষ্ট সংস্করণ ও যাচাইয়ের ক্ষেত্রেই প্রযোজ্য"},{"id":"SUTI.crystal","title":"স্পষ্ট রূপ","purpose":"সারবস্তু এমন নথিতে রাখা যা নিজে থেকেই বোঝা যায়","procedure":"প্রশ্ন ও উৎস চিহ্নিত করুন → অপরিবর্তনীয় মূলটি চিহ্নিত করুন → উদাহরণ ও সীমা দেখান → পরের পদক্ষেপ যোগ করুন","output":"উৎস ও প্রেক্ষাপটসহ সার-কার্ড","boundary":"সংক্ষিপ্ততার অজুহাতে শর্ত, লেখকত্ব বা অনিশ্চয়তা বাদ দেওয়া যায় না"},{"id":"SUTI.oracle","title":"ভিত্তির পার্থক্য নির্ণয়","purpose":"তথ্য, ব্যাখ্যা ও অজানা বিষয় আলাদা করা","procedure":"দাবি লিখুন → ধরন বলুন → ভিত্তি দিন → যাচাইয়ের উপায় বর্ণনা করুন","output":"দাবি ও ভিত্তির মানচিত্র","boundary":"এটি বিবেচনার পদ্ধতি, ভবিষ্যদ্বাণী বা স্বয়ংসম্পূর্ণ কর্তৃত্ব নয়"},{"id":"SUTI.veche","title":"যৌথ বিবেচনা","purpose":"প্রস্তাব ও মতভেদ দৃশ্যমান করা","procedure":"প্রস্তাব রাখুন → অবস্থান জানতে চান → সমর্থন, আপত্তি, বিরত থাকা ও উত্তর না পাওয়া আলাদা লিখুন → দায়িত্বপ্রাপ্ত ব্যক্তি সিদ্ধান্ত নেবেন","output":"বিবেচনার নথি এবং মানুষের নেওয়া সিদ্ধান্ত","boundary":"নীরবতা সম্মতি নয়; AI-এর পর্যালোচনা মানুষের ভোট নয়"},{"id":"SUTI.sotkan","title":"সংযোগ ও উৎসের ইতিহাস","purpose":"উপাদানকে উৎস ও পরিবর্তনের ইতিহাসের সঙ্গে যুক্ত করা","procedure":"উৎস দিন → রূপান্তর বর্ণনা করুন → সংশোধিত পাঠের সঙ্গে মূলের যোগ দিন → সংশোধন ও ফেরার উপায় যাচাই করুন","output":"উৎসের যাচাইযোগ্য ইতিহাস","boundary":"পাঠের মিল লেখকত্ব, লাইসেন্স বা অধিকার হস্তান্তরের প্রমাণ নয়"},{"id":"SUTI.game","title":"স্বেচ্ছামূলক অনুশীলন","purpose":"NITYA ও Samurai Dharma খেলার মাধ্যমে দক্ষতা অন্বেষণ করা","procedure":"সাধারণ বা প্রতীকী ভাষা বাছুন → ছোট কুয়েস্ট নিন → চেষ্টা করুন → পর্যবেক্ষণ লিখুন বা বাদ দিন → এগোনোর সিদ্ধান্ত নিন","output":"অনুশীলনের অভিজ্ঞতা ও নিজের পরের পদক্ষেপ","boundary":"খেলা ঐচ্ছিক; বিরতি, বাদ দেওয়া ও সরে যাওয়ার সুযোগ থাকে; বয়সভিত্তিক পথে আলাদা পর্যালোচনা দরকার"},{"id":"SUTI.logos","title":"ভাষা ও সৃজনশীল অর্থানুবাদ","purpose":"ভাষা ও পরিবেশ বদলানোর সময় অর্থ অক্ষুণ্ণ রাখা","procedure":"উদ্দেশ্য ও অপরিবর্তনীয় মূল নির্ধারণ করুন → সরাসরি উৎস থেকে অনুবাদ করুন → শর্ত ও নিশ্চিততার মাত্রা মিলিয়ে দেখুন → স্বাধীন সম্পাদনা চান","output":"বোধগম্য পাঠ, পরিভাষা ও প্রতিটি ভাষা-সংস্করণের অবস্থা","boundary":"খসড়া যাচাই করা অনুবাদ নয়; Язэхъ-এর জন্য লেখকের শব্দার্থ দরকার"},{"id":"SUTI.verenium","title":"যত্নের পথনির্দেশ","purpose":"মানুষকে সাধ্যের মধ্যে সহায়তা ও নিজের পদক্ষেপ বেছে নিতে সাহায্য করা","procedure":"কী গুরুত্বপূর্ণ জিজ্ঞেস করুন → বোধগম্য বিকল্প দিন → সীমা স্পষ্ট করুন → বাছাই, বিরতি ও সরে যাওয়ার সুযোগ রাখুন","output":"বেছে নেওয়া সহায়তার পথ ও সম্মত কাজ","boundary":"যত্নের দেবদূত একটি ঐচ্ছিক প্রতীক; এটি জরুরি বা চিকিৎসামূলক সেবা নয়"}],"locale":"bn","translation_state":"direct-source-draft-unreviewed","native_review":"pending","release":"HOLD","home_href":"../../../bn/living-system.html","fund_href":"../../../bn/care-90-days.html","contour_hrefs":{"SUTI.os":"../../../bn/SUTI.os/living-system.html","SUTI.world":"../../../bn/SUTI.world/living-system.html","SUTI.uni":"../../../bn/SUTI.uni/living-system.html","SUTI.clan":"../../../bn/SUTI.clan/living-system.html","SUTI.lab":"../../../bn/SUTI.lab/living-system.html","SUTI.audit":"../../../bn/SUTI.audit/living-system.html","SUTI.crystal":"../../../bn/SUTI.crystal/living-system.html","SUTI.oracle":"../../../bn/SUTI.oracle/living-system.html","SUTI.veche":"../../../bn/SUTI.veche/living-system.html","SUTI.sotkan":"../../../bn/SUTI.sotkan/living-system.html","SUTI.game":"../../../bn/SUTI.game/living-system.html","SUTI.logos":"../../../bn/SUTI.logos/living-system.html","SUTI.verenium":"../../../bn/SUTI.verenium/living-system.html"}},"eo":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · komuna vivanta sistemo","intro":"publika sistemo de metodoj kaj kunlaboro: kompreni la gravan, trovi vortojn kaj elekti atingeblan paŝon. Ĉiu partoprenanto konservas aŭtorecon kaj la rajton korekti, rifuzi kaj eliri.","status":"nova komuna operacia tavolo: loka redakta malneto; sendependa lingva revizio estas atendata; jura fondo, ricevo de mono, funkcianta tutmonda reto kaj publikigo ne estas konfirmitaj","cycle":"demando → vortoj → ligoj → mapo → paŝo → spuro → precizigo","privacy":"en la publika medio restas metodoj, ĝeneralaj instrukcioj kaj kontrolitaj ekzemploj. Personaj notoj, kontaktinformoj, korespondado kaj sentemaj informoj estas konservataj aparte kaj ne inkluzivataj en la komuna eksporto.","rights":"aŭtoreco, videbleco, permesilo kaj permesitaj agoj estas difinataj aparte por ĉiu kontribuo. Valida permesilo por la tuta malnova tekstaro ne estas konstatita.","contribution":"proponu ŝanĝon kun fonto kaj kialo → priskribu la kontrolon → petu konsenton de la koncernaj partoprenantoj → respondeculo akceptas aŭ prokrastas la ŝanĝon → konservu la spuron kaj eblon malfari","sovereignty":"informa suvereneco: kompreni la devenon de datumoj kaj elekti aliron, eksporton kaj forigon de propraj notoj. Lingva, eduka, kreiva, ekonomia kaj organiza memstareco disvolviĝas per kompreneblaj kapabloj kaj kontroleblaj decidoj; atingo ne estas promesata.","fund_title":"fonduso por subteni la vivon kaj tiujn, kiuj amas la vivon · agentejo de zorgaj anĝeloj","fund_purpose":"projekto por malferme subteni utilajn iniciatojn: lernadon, alireblajn ilojn, interhelpon kaj zorgon pri la vivanta medio. La nomo estas provizora; partopreno kaj la anĝela bildo estas libervolaj.","fund_state":"la loka prepara ciklo komenciĝis la 13-an de novembro 2026. Tago 90 estas la 10-a de februaro 2027. Registrado, jurisdikcio, administrantoj, banko, donacreguloj kaj imposta reĝimo restas UNKNOWN; monaj operacioj ne estas aktivigitaj.","fund_flow":"malferma peto sen sentemaj detaloj → kontrolo de kongruo kun la celo kaj disponeblaj rimedoj → decido sen intereskonflikto → limigita subteno → konfirmo de rezulto sen malkaŝo de la ricevanto → eblo apelacii kaj korekti","fund_phases":[["1–15","2026-11-13 — 2026-11-27","interkonsenti pri celo, decidrespondeculo, lando de registrado, roldivido kaj partoprenkondiĉoj; formi buĝetan modelon sen monkolektado"],["16–30","2026-11-28 — 2026-12-12","kontroli la juran vojon kaj partneran alternativon; interkonsenti pri reguloj de subteno, intereskonfliktoj, apelacioj, datumtraktado kaj financa kontrolo"],["31–45","2026-12-13 — 2026-12-27","kunmeti publikajn instrukciojn en 13 lingvoj, alireblan prototipon de roboto kaj formularo, kaj bibliotekon de mikrolecionoj; komenci sendependan revizion"],["46–60","2026-12-28 — 2027-01-11","fari malgrandan libervolan piloton post la necesaj permesoj; kontroli konsenton, alireblecon, respondojn, eksporton kaj forigon de propraj datumoj"],["61–75","2027-01-12 — 2027-01-26","taksi la piloton, korekti difektojn, prepari lokajn partnergrupojn; plivastigi nur konfirmitajn procezojn"],["76–90","2027-01-27 — 2027-02-10","kompari rezultojn kun kriterioj, publikigi permesitan anonimigitan raporton post aprobo, decidi pri la sekva ciklo kaj geografia amplekso"]],"fund_roles":"programrespondeculo; financoj kaj sendependa kontokontrolo; datumprotekto kaj sekureco de partoprenantoj; lingvaj redaktantoj; pilotkunordigantoj; sendependa traktado de apelacioj. Roloj estas proponataj; homoj ne estas nomumitaj.","fund_metrics":"registri konsentitan partoprenon, plenumitajn utilajn agojn, respondtempon, alireblecon, korektojn kaj realajn elspezojn. Celoj kaj nombraj sojloj estas aprobataj antaŭ la piloto; virusa disvastiĝo kaj tutmonda atingo ne estas garantiataj.","fund_pause":"malkongruo inter mono kaj raporto, rompo de konsento, datumliko, plendo pri damaĝo aŭ manko de respondeculo kondukas al paŭzo de la koncerna procezo, ekzameno kaj homa decido.","contours":[{"id":"SUTI.os","title":"aranĝo de la sistemo","purpose":"interkonsenti pri limoj, iloj, konservado kaj restarigo","procedure":"elektu taskon kaj medion → priskribu eniron kaj rezulton → kontrolu aliron kaj revenon → konservu laborinstrukcion","output":"mapo de la medio kaj ripetebla laborpaŝo","boundary":"priskribo ne konfirmas instalitan sistemon aŭ sekurecon"},{"id":"SUTI.world","title":"publika enirejo","purpose":"helpi homon trovi taŭgan direkton kaj sekvan paŝon","procedure":"nomu la demandon → elektu lingvon → malfermu taŭgan modulon → provu unu atingeblan paŝon","output":"komprenebla vojo kaj elektita ago","boundary":"la amplekso de reto kaj ĝia utileco estas konfirmataj per observoj, ne per promeso"},{"id":"SUTI.uni","title":"memlernado","purpose":"transformi demandon en mallongan lernpraktikon","procedure":"formulu kapablon → studu unu ekzemplon → plenumu etan taskon → kontrolu komprenon per propraj vortoj","output":"mikroleciono, ekzemplo kaj reagoj","boundary":"lernado ne anstataŭas profesian helpon aŭ kvalifikon"},{"id":"SUTI.clan","title":"kunlaboro","purpose":"interkonsenti pri roloj, kontribuoj kaj partoprenlimoj","procedure":"formulu komunan agadon → petu eksplicitan partoprenon → interkonsentu pri rajtoj kaj rolo → konservu la decidon","output":"interkonsento de partoprenantoj kaj mapo de respondecoj","boundary":"nomo de homo aŭ organizaĵo sur mapo ne signifas partnerecon aŭ konsenton"},{"id":"SUTI.lab","title":"esplorado","purpose":"kontroli ideojn per malgrandaj malfareblaj provoj","procedure":"nomu hipotezon → elektu observeblan signon → faru limigitan provon → notu rezulton kaj dubojn","output":"esplornoto kun fundamentoj","boundary":"hipotezo aŭ simbolo ne fariĝas fakto sen kontrolo"},{"id":"SUTI.audit","title":"kontrolado","purpose":"kompari rezulton kun eksplicita kriterio","procedure":"difinu amplekson → elektu kriterion → kontrolu la materialon → registru PASS, PARTIAL, FAIL aŭ UNKNOWN","output":"raporto, pruvaroj kaj malfermaj demandoj","boundary":"PASS validas nur por la nomita versio kaj kontrolo"},{"id":"SUTI.crystal","title":"klara formo","purpose":"konservi la esencan en memstare komprenebla verko","procedure":"elstarigu demandon kaj fonton → nomu la invarianton → montru ekzemplon kaj limon → aldonu sekvan paŝon","output":"esencokarto kun fonto kaj kunteksto","boundary":"koncizeco ne pravigas perdon de kondiĉoj, aŭtoreco aŭ necerteco"},{"id":"SUTI.oracle","title":"distingado de fundamentoj","purpose":"apartigi informojn, interpretojn kaj nekonataĵojn","procedure":"formulu aserton → nomu la tipon → indiku fundamenton → priskribu kontrolmanieron","output":"mapo de asertoj kaj fundamentoj","boundary":"tio estas ekzamenmetodo, ne antaŭdiro aŭ memstara aŭtoritato"},{"id":"SUTI.veche","title":"komuna konsiderado","purpose":"videbligi proponojn kaj malkonsentojn","procedure":"prezentu proponon → petu starpunktojn → aparte registru subtenon, kontraŭstaron, sindetenon kaj mankon de respondo → respondeca homo decidas","output":"konsiderprotokolo kaj homa decido","boundary":"silento ne estas konsento; AI-revizio ne estas homa voĉdonado"},{"id":"SUTI.sotkan","title":"ligoj kaj deveno","purpose":"ligi materialojn kun fontoj kaj ŝanĝhistorio","procedure":"indiku fonton → priskribu transformon → ligu redakton kun originalo → kontrolu eblon korekti kaj reveni","output":"kontrolebla devenspuro","boundary":"teksta simileco ne pruvas aŭtorecon, permesilon aŭ transdonon de rajtoj"},{"id":"SUTI.game","title":"libervola praktiko","purpose":"esplori kapablojn per la ludoj NITYA kaj Samurai Dharma","procedure":"elektu ordinaran aŭ simbolan lingvaĵon → prenu etan serĉtaskon → provu → registru observon aŭ preterlasu → elektu daŭrigon","output":"praktika sperto kaj propra sekva paŝo","boundary":"la ludo estas libervola; paŭzo, preterlaso kaj eliro haveblas; aĝovojoj postulas apartan kontrolon"},{"id":"SUTI.logos","title":"lingvo kaj transkreado","purpose":"konservi signifon dum transiro inter lingvoj kaj medioj","procedure":"elstarigu intencon kaj invarianton → traduku rekte el fonto → komparu kondiĉojn kaj certecon → petu sendependan revizion","output":"komprenebla teksto, terminoj kaj stato de ĉiu lingvo","boundary":"malneto ne egalas kontrolitan tradukon; Yazekh postulas aŭtoran gloson"},{"id":"SUTI.verenium","title":"zorga navigado","purpose":"helpi homon elekti fareblan helpon kaj propran paŝon","procedure":"demandu, kio gravas → proponu kompreneblajn eblojn → precizigu limojn → lasu elekton, paŭzon kaj eliron","output":"elektita helpvojo kaj interkonsentita ago","boundary":"zorga anĝelo estas libervola bildo; la servo ne estas urĝa aŭ klinika servo"}],"locale":"eo","editorial_status":"AI-assisted-draft; independent-native-and-semantic-review-pending","translation_state":"direct-source-draft-unreviewed","native_review":"pending","release":"HOLD","home_href":"../../../eo/living-system.html","fund_href":"../../../eo/care-90-days.html","contour_hrefs":{"SUTI.os":"../../../eo/SUTI.os/living-system.html","SUTI.world":"../../../eo/SUTI.world/living-system.html","SUTI.uni":"../../../eo/SUTI.uni/living-system.html","SUTI.clan":"../../../eo/SUTI.clan/living-system.html","SUTI.lab":"../../../eo/SUTI.lab/living-system.html","SUTI.audit":"../../../eo/SUTI.audit/living-system.html","SUTI.crystal":"../../../eo/SUTI.crystal/living-system.html","SUTI.oracle":"../../../eo/SUTI.oracle/living-system.html","SUTI.veche":"../../../eo/SUTI.veche/living-system.html","SUTI.sotkan":"../../../eo/SUTI.sotkan/living-system.html","SUTI.game":"../../../eo/SUTI.game/living-system.html","SUTI.logos":"../../../eo/SUTI.logos/living-system.html","SUTI.verenium":"../../../eo/SUTI.verenium/living-system.html"}},"sa":{"schema":"suti.living-system.source.v1","source_locale":"ru","version":"2026-11-13.v1","title":"SUTI · सामान्य जीवन्तव्यवस्था","intro":"पद्धतीनां सहकार्यस्य च सार्वजनिकव्यवस्था—महत्त्वपूर्णं विषयम् अवगन्तुं, शब्दान् अन्वेष्टुं, साध्यं पदं चेतुं च। प्रत्येकः सहभागी स्वकीयकर्तृत्वं तथा संशोधनस्य, निराकरणस्य, निर्गमनस्य च अधिकारं धारयति।","status":"नूतनः सामान्य कार्यस्तरः—स्थानीयं सम्पादकीयप्रारूपम्; स्वतन्त्रा भाषासमीक्षा प्रतीक्ष्यते। विधिसम्मतः निधिः, धनग्रहणं, कार्यरतं विश्वजालं प्रकाशनं च न प्रमाणितानि।","cycle":"प्रश्नः → शब्दाः → सम्बन्धाः → मानचित्रम् → पदम् → अभिलेखः → परिष्कारः","privacy":"सार्वजनिकक्षेत्रे पद्धतयः, सामान्यनिर्देशाः, परीक्षितोदाहरणानि च तिष्ठन्ति। वैयक्तिकटिप्पण्यः, सम्पर्कसूचनाः, पत्राचारः, संवेदनशीलसूचनाश्च पृथक् रक्ष्यन्ते; सामान्य निर्याते न समाविशन्ति।","rights":"प्रत्येकस्य योगदानस्य कर्तृत्वं, दृश्यता, अनुज्ञापत्रं, अनुमतक्रियाश्च पृथक् निर्दिश्यन्ते। पुरातनस्य सम्पूर्णसंग्रहस्य वैधम् अनुज्ञापत्रं न स्थापितम्।","contribution":"स्रोतसा कारणेन च सह परिवर्तनं प्रस्तावय → परीक्षणं वर्णय → प्रभावितानां सहभागिनां सम्मतिं याचस्व → उत्तरदायी मनुष्यः परिवर्तनम् अङ्गीकरोति अथवा स्थगयति → अभिलेखं पूर्वस्थितिप्रत्यावर्तनस्य सम्भावनां च रक्ष","sovereignty":"सूचनास्वायत्तता—दत्तांशस्य उत्पत्तिम् अवगन्तुं, स्वकीयलेखानां प्रवेशं, निर्यातं, विलोपनं च चेतुम्। भाषायाः, शिक्षायाः, सर्जनस्य, अर्थव्यवहारस्य, सङ्गठनस्य च स्वावलम्बनं सुबोधकौशलैः परीक्ष्यनिर्णयैश्च वर्धते; सिद्धिः न प्रतिज्ञायते।","fund_title":"जीवनस्य जीवनप्रेमिणां च समर्थननिधिः · परिचर्यादूतानां संस्था","fund_purpose":"उपयोगिनाम् उपक्रमाणां मुक्तसमर्थनपरियोजना—शिक्षणम्, सुलभसाधनानि, परस्परसाहाय्यं, जीवन्तपर्यावरणस्य परिचर्या च। नाम तात्कालिकम्; सहभागिता दूतप्रतिमा च स्वैच्छिकी।","fund_state":"13 नवम्बर 2026 तमे दिने स्थानीयः सन्नाहचक्रः आरब्धः। 90 तमः दिवसः 10 फरवरी 2027 अस्ति। पञ्जीकरणं, विधिक्षेत्रं, प्रबन्धकाः, वित्तकोशः, दाननियमाः, करव्यवस्था च अद्यापि UNKNOWN; धनव्यवहाराः न प्रवर्तिताः।","fund_flow":"संवेदनशीलविवरणरहितः सार्वजनिकानुरोधः → उद्देश्यानुकूलतायाः उपलब्धसाधनानां च परीक्षणम् → हितविरोधरहितो निर्णयः → सीमितसमर्थनम् → लाभार्थिनम् अप्रकाश्य फलस्य प्रमाणनम् → पुनर्विचारयाचनायाः संशोधनस्य च अवसरः","fund_phases":[["1–15","2026-11-13 — 2026-11-27","उद्देश्यं, निर्णयस्य उत्तरदायिनं, पञ्जीकरणदेशं, कार्यविभागं, सहभागितानियमांश्च सम्मत्या निश्चितुं; धनसंग्रहं विना आयव्यययोजनां निर्मातुम्"],["16–30","2026-11-28 — 2026-12-12","विधिमार्गं सहभागिसंस्थया सह विकल्पं च परीक्षितुं; समर्थनस्य, हितविरोधस्य, पुनर्विचारयाचनायाः, दत्तांशप्रक्रियायाः, वित्तनियन्त्रणस्य च नियमेषु सम्मतिं साधयितुम्"],["31–45","2026-12-13 — 2026-12-27","13 भाषासु सार्वजनिकनिर्देशान्, सुलभं संवादयन्त्रस्य आवेदनपत्रस्य च प्रारूपं, लघुपाठसंग्रहं च निर्मातुं; स्वतन्त्रसमीक्षाम् आरब्धुम्"],["46–60","2026-12-28 — 2027-01-11","आवश्यकानुमतीः प्राप्य लघुं स्वैच्छिकं प्रायोगिककार्यं कर्तुं; सम्मतिं, सुगम्यतां, उत्तराणि, स्वदत्तांशस्य निर्यातं विलोपनं च परीक्षितुम्"],["61–75","2027-01-12 — 2027-01-26","प्रायोगिककार्यस्य मूल्याङ्कनं कर्तुं, दोषान् संशोधयितुं, स्थानीयसहभागिसमूहान् सन्नद्धान् कर्तुं; केवलं प्रमाणितप्रक्रियाः विस्तारयितुम्"],["76–90","2027-01-27 — 2027-02-10","फलानि निकषैः तुलयितुं, अनुमतिं प्राप्य स्वीकार्यं व्यक्तिपरिचयरहितं प्रतिवेदनं प्रकाशयितुं, अग्रिमचक्रस्य प्रदेशानां च निर्णयं कर्तुम्"]],"fund_roles":"कार्यक्रमस्य उत्तरदायी; वित्तकार्यं स्वतन्त्रमेलनपरीक्षा च; दत्तांशरक्षा सहभागिसुरक्षा च; भाषासम्पादकाः; प्रायोगिककार्यसमन्वयकाः; पुनर्विचारयाचनानां स्वतन्त्रसमीक्षा। कार्यभूमिकाः प्रस्ताविताः; व्यक्तयः न नियुक्ताः।","fund_metrics":"सम्मतसहभागितां, सम्पन्नोपयोगिक्रियाः, उत्तरकालं, सुगम्यतां, संशोधनानि, वास्तविकव्ययांश्च गणयेत्। लक्ष्याणि सङ्ख्यात्मकसीमाश्च प्रायोगिककार्याद् पूर्वम् अनुमोदनीयाः; तीव्रप्रसारः विश्वव्याप्तिश्च न प्रत्याभूयेते।","fund_pause":"धनप्रतिवेदनयोः विसंवादः, सम्मतिभङ्गः, दत्तांशस्रवणं, हानिविषयिणी परिवेदना, उत्तरदायिनोऽभावो वा तत्सम्बद्धप्रक्रियायाः विरामं, समीक्षां, मानवनिर्णयं च जनयन्ति।","contours":[{"id":"SUTI.os","title":"व्यवस्थायाः रचना","purpose":"सीमाः, साधनानि, संग्रहणं, पुनःस्थापनं च सम्मत्या निश्चितुम्","procedure":"कार्यं क्षेत्रं च चिनु → आगमं फलं च वर्णय → प्रवेशं प्रत्यागमनं च परीक्षस्व → कार्यनिर्देशं रक्ष","output":"परिसरमानचित्रं पुनरनुष्ठेयं कार्यपदं च","boundary":"वर्णनं स्थापितव्यवस्थां सुरक्षां वा न प्रमाणयति"},{"id":"SUTI.world","title":"सार्वजनिकः प्रवेशः","purpose":"मनुष्याय योग्यां दिशम् अग्रिमपदं च अन्वेष्टुं साहाय्यं कर्तुम्","procedure":"प्रश्नं वद → भाषां चिनु → योग्यं विभागम् उद्घाटय → एकं साध्यं पदं प्रयतस्व","output":"सुबोधमार्गः चयनितक्रिया च","boundary":"जालस्य विस्तारः उपयोगश्च निरीक्षणैः प्रमाण्येते, न प्रतिज्ञया"},{"id":"SUTI.uni","title":"स्वाध्यायः","purpose":"प्रश्नं लघुशिक्षाभ्यासे परिणमयितुम्","procedure":"कौशलं निर्दिश → एकम् उदाहरणम् अधीष्व → लघुकार्यं सम्पादय → स्वशब्दैः अवबोधं परीक्षस्व","output":"लघुपाठः, उदाहरणं, प्रत्याभिप्रायश्च","boundary":"शिक्षणं व्यावसायिकसाहाय्यस्य योग्यतायाश्च स्थानं न गृह्णाति"},{"id":"SUTI.clan","title":"सहकार्यम्","purpose":"भूमिकाः, योगदानं, सहभागितासीमाश्च सम्मत्या निश्चितुम्","procedure":"सामान्यकार्यं निर्दिश → स्पष्टां सहभागितां याचस्व → अधिकारान् भूमिकां च सम्मत्या निश्चितं कुरु → निर्णयं रक्ष","output":"सहभागिनां सम्मतिः उत्तरदायित्वमानचित्रं च","boundary":"मानचित्रे व्यक्तेः संस्थायाः वा नाम सहकारसम्बन्धं सम्मतिं वा न बोधयति"},{"id":"SUTI.lab","title":"अनुसन्धानम्","purpose":"लघुभिः प्रत्यावर्तनीयप्रयोगैः विचारान् परीक्षितुम्","procedure":"परिकल्पनां वद → निरीक्षणीयं चिह्नं चिनु → सीमितं प्रयोगं कुरु → फलं संशयांश्च लिख","output":"आधारसहितः अनुसन्धानाभिलेखः","boundary":"परिकल्पना प्रतीकं वा परीक्षणं विना तथ्यं न भवति"},{"id":"SUTI.audit","title":"परीक्षणम्","purpose":"फलं स्पष्टनिकषेण तुलयितुम्","procedure":"क्षेत्रं निर्दिश → निकषं चिनु → सामग्रीं परीक्षस्व → PASS, PARTIAL, FAIL अथवा UNKNOWN लिख","output":"प्रतिवेदनं, प्रमाणानि, अनिर्णीतप्रश्नाश्च","boundary":"PASS केवलं निर्दिष्टसंस्करणस्य निर्दिष्टपरीक्षणस्य च विषये प्रवर्तते"},{"id":"SUTI.crystal","title":"स्पष्टं रूपम्","purpose":"स्वतः सुबोधे निर्माणे सारं रक्षितुम्","procedure":"प्रश्नं स्रोतश्च पृथक्कुरु → अपरिवर्तनीयसारं वद → उदाहरणं सीमां च दर्शय → अग्रिमपदं योजय","output":"स्रोतसा सन्दर्भेण च सहितं सारपत्रम्","boundary":"संक्षेपः नियमानां, कर्तृत्वस्य, अनिश्चिततायाः वा हानिं न समर्थयति"},{"id":"SUTI.oracle","title":"आधारविवेकः","purpose":"सूचनाः, व्याख्याः, अज्ञातं च पृथक्कर्तुम्","procedure":"कथनं रचय → प्रकारं वद → आधारं निर्दिश → परीक्षणोपायं वर्णय","output":"कथनानाम् आधाराणां च मानचित्रम्","boundary":"एषा समीक्षापद्धतिः, न भविष्यवाणी न वा स्वायत्तः प्रमाणाधिकारी"},{"id":"SUTI.veche","title":"सामूहिकसमीक्षा","purpose":"प्रस्तावान् मतभेदांश्च दृश्यान् कर्तुम्","procedure":"प्रस्तावं प्रस्तुतं कुरु → मतानि याचस्व → समर्थनं, विरोधं, विरतिं, उत्तराभावं च पृथक् लिख → उत्तरदायी मनुष्यः निर्णयं करोति","output":"समीक्षाभिलेखः मनुष्यकृतनिर्णयश्च","boundary":"मौनं सम्मतिः न भवति; AI-समीक्षा मनुष्याणां मतदानं न गण्यते"},{"id":"SUTI.sotkan","title":"सम्बन्धाः उत्पत्तिश्च","purpose":"सामग्रीं स्रोतसा परिवर्तनवृत्तान्तेन च योजयितुम्","procedure":"स्रोतः निर्दिश → रूपान्तरणं वर्णय → संस्करणं मूलपाठेन योजय → संशोधनप्रत्यावर्तनयोः सम्भावनां परीक्षस्व","output":"परीक्षणीयः उत्पत्त्यभिलेखः","boundary":"पाठसादृश्यं कर्तृत्वम् अनुज्ञापत्रम् अधिकारहस्तान्तरणं वा न प्रमाणयति"},{"id":"SUTI.game","title":"स्वैच्छिकोऽभ्यासः","purpose":"NITYA तथा Samurai Dharma इति क्रीडाभ्यां कौशलानि अन्वेष्टुम्","procedure":"सामान्यं प्रतीकात्मकं वा भाषारूपं चिनु → लघुं क्रीडाकार्यं गृहाण → प्रयतस्व → निरीक्षणं लिख अथवा त्यज → अग्रिमं चिनु","output":"अभ्यासानुभवः स्वकीयम् अग्रिमपदं च","boundary":"क्रीडा स्वैच्छिकी; विरामः, त्यागः, निर्गमनं च सुलभानि; वयोमार्गाणां पृथक् परीक्षणम् आवश्यकम्"},{"id":"SUTI.logos","title":"भाषा भावानुवादश्च","purpose":"भाषान्तरपरिसरान्तरेषु अर्थं रक्षितुम्","procedure":"अभिप्रायम् अपरिवर्तनीयसारं च पृथक्कुरु → मूलात् साक्षात् अनुवादं कुरु → नियमान् निश्चयमात्रां च तुलय → स्वतन्त्रसमीक्षां याचस्व","output":"सुबोधपाठः, पारिभाषिकशब्दाः, प्रत्येकभाषायाः स्थितिश्च","boundary":"प्रारूपं परीक्षितानुवादः न भवति; Yazekh कृते कर्तृकृता शब्दव्याख्या आवश्यकी"},{"id":"SUTI.verenium","title":"परिचर्यामार्गदर्शनम्","purpose":"मनुष्याय साध्यं साहाय्यं स्वकीयपदं च चेतुं साहाय्यं कर्तुम्","procedure":"किं महत्त्वपूर्णमिति पृच्छ → सुबोधविकल्पान् प्रस्तावय → सीमाः स्पष्टीकुरु → चयनं विरामं निर्गमनं च अनुमन्यस्व","output":"चयनितः साहाय्यमार्गः सम्मतक्रिया च","boundary":"परिचर्यादूतः स्वैच्छिकी प्रतिमा; इयं सेवा न आपत्कालसेवा, न च चिकित्सासेवा।"}],"locale":"sa","editorial_status":"experimenta чь человеку найти нужное направление и следующий шаг","procedure":"назови вопрос → выбери язык → открой подходящий модуль → попробуй один доступный шаг","output":"понятный маршрут и выбранное действие","boundary":"масштаб сети и польза подтверждаются наблюдениями, не обещанием"},{"id":"SUTI.uni","title":"самообразование","purpose":"превратить вопрос в короткую учебную практику","procedure":"сформулируй навык → изучи один пример → выполни малую задачу → проверь понимание своими словами","output":"микроурок, пример и обратная связь","boundary":"обучение не подменяет профессиональную помощь и квалификацию"},{"id":"SUTI.clan","title":"сотрудничество","purpose":"согласовать роли, вклад и границы участия","procedure":"сформулируй общее дело → запроси явное участие → согласуй права и роль → сохрани решение","output":"договорённость участников и карта ответственности","boundary":"имя человека или организации в карте не означает партнёрство или согласие"},{"id":"SUTI.lab","title":"исследование","purpose":"проверять идеи небольшими обратимыми пробами","procedure":"назови гипотезу → выбери наблюдаемый признак → проведи ограниченную пробу → запиши результат и сомнения","output":"исследовательская запись с основаниями","boundary":"гипотеза и символ не становятся фактом без проверки"},{"id":"SUTI.audit","title":"проверка","purpose":"сопоставлять результат с явным критерием","procedure":"определи область → выбери критерий → проверь материал → зафиксируй PASS, PARTIAL, FAIL или UNKNOWN","output":"отчёт, доказательства и открытые вопросы","boundary":"PASS действует только для названной версии и проверки"},{"id":"SUTI.crystal","title":"ясная форма","purpose":"сохранить существенное в самостоятельно понятном артефакте","procedure":"выдели вопрос и источник → назови инвариант → покажи пример и предел → добавь следующий шаг","output":"карточка сути с источником и контекстом","boundary":"краткость не оправдывает потерю условий, авторства или неопределённости"},{"id":"SUTI.oracle","title":"различение оснований","purpose":"отделять сведения, интерпретации и неизвестное","procedure":"сформулируй утверждение → назови тип → укажи основание → опиши способ проверки","output":"карта утверждений и оснований","boundary":"это метод рассмотрения, не предсказание и не автономный авторитет"},{"id":"SUTI.veche","title":"совместное рассмотрение","purpose":"делать предложения и разногласия видимыми","procedure":"представь предложение → запроси позиции → отдельно запиши поддержку, возражение, воздержание и отсутствие ответа → решение принимает ответственный человек","output":"журнал рассмотрения и принятое человеком решение","boundary":"молчание не является согласием; AI-обзор не считается голосованием людей"},{"id":"SUTI.sotkan","title":"связи и происхождение","purpose":"связывать материалы с источниками и историей изменений","procedure":"укажи источник → опиши преобразование → свяжи редакцию с оригиналом → проверь возможность исправления и возврата","output":"проверяемый след происхождения","boundary":"сходство текста не доказывает авторство, лицензию или передачу прав"},{"id":"SUTI.game","title":"добровольная практика","purpose":"исследовать навыки через игру NITYA и Samurai Dharma","procedure":"выбери обычный или символический язык → возьми малый квест → попробуй → запиши наблюдение или пропусти → выбери продолжение","output":"опыт практики и собственный следующий шаг","boundary":"игра добровольна; пауза, пропуск и выход доступны; возрастные дорожки требуют отдельной проверки"},{"id":"SUTI.logos","title":"язык и транскреация","purpose":"сохранять смысл при переносе между языками и средами","procedure":"выдели намерение и инвариант → переведи прямо с источника → сопоставь условия и уверенность → запроси независимую вычитку","output":"понятный текст, термины и статус каждой локали","boundary":"черновик не равен проверенному переводу; Язэхъ требует авторского глосса"},{"id":"SUTI.verenium","title":"навигация заботы","purpose":"помогать человеку выбрать посильную по
