name: publish suti.world
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: prepare public site
        run: cp -R website _site
      - name: upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
